<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0d0f13">
<title>Bleachers</title>
<style>
/* ============================ THEME TOKENS ============================ */
:root{
  --bg:#0d0f13;
  --surface:#161a20;
  --surface2:#1d222b;
  --elev:#222834;
  --border:#272d38;
  --border-soft:#1f242d;
  --text:#eef1f5;
  --muted:#8a93a3;
  --faint:#5b6472;
  --accent:#5DCAA5;
  --accent-dim:#0f3a2e;
  --gold:#F2B14C;
  --live:#F0413F;
  --win:#2F9A70;
  --lose:#C24B4A;
  --draw:#5b6472;
  /* chart marks - validated for the dark card surface (CVD + contrast checks) */
  --ch1:#2F9A70;
  --ch2:#3B78BE;
  --ch3:#C08120;
  --radius:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif;
  line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:hidden;
}
.shell{max-width:440px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:88px;background:var(--bg)}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
}

/* utilities */
.muted{color:var(--muted)} .tiny{font-size:11px} .small{font-size:13px}
.center{text-align:center}
.row{display:flex;align-items:center} .between{display:flex;align-items:center;justify-content:space-between}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}
.sec-title{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700;margin:20px 4px 10px}

/* ============================ TOP BAR ============================ */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px 10px;background:linear-gradient(180deg,var(--bg) 72%,rgba(13,15,19,0))}
.brand{font-weight:800;font-size:19px;letter-spacing:.14em;text-transform:uppercase}
.brand b{color:var(--accent);font-weight:800}
.tb-right{display:flex;align-items:center;gap:9px}
.livecount{display:flex;align-items:center;gap:6px;background:rgba(240,65,63,.12);border:1px solid rgba(240,65,63,.4);
  color:var(--live);font-size:12px;font-weight:800;padding:5px 10px;border-radius:999px;letter-spacing:.04em;cursor:pointer}
.tb-btn{width:34px;height:34px;border-radius:50%;border:1px solid var(--border);background:var(--surface);
  color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer}
.tb-av{width:34px;height:34px;border-radius:50%;background:linear-gradient(140deg,var(--accent),#2f7d64);
  color:#06241a;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;cursor:pointer;border:0}

/* ============================ SCREEN TRANSITIONS ============================ */
.screen{padding:0 14px;animation:rise .28s cubic-bezier(.22,1,.36,1) both}
/* steady re-renders (live ticks, toasts) skip entrance animations */
.screen.steady,.dbody.steady,.steady .brief,.steady .motd,.steady .venue-note{animation:none}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.screen h1{font-size:23px;margin:4px 4px 2px;letter-spacing:-.01em}
.screen .sub{color:var(--muted);font-size:13px;margin:0 4px 8px}

/* ============================ SEGMENTED / CHIPS / DATE STRIP ============================ */
.seg{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:4px;margin:8px 4px}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);padding:10px;border-radius:9px;font-weight:700;font-size:14px;transition:.2s}
.seg button.on{background:var(--elev);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.35)}
.datestrip{display:flex;gap:6px;padding:4px;overflow-x:auto;scrollbar-width:none}
.datestrip::-webkit-scrollbar{display:none}
.dchip{flex:1;min-width:60px;border:1px solid var(--border);background:var(--surface);color:var(--muted);
  padding:7px 4px;border-radius:12px;text-align:center;transition:.15s}
.dchip .dw{font-size:10px;text-transform:uppercase;letter-spacing:.06em;display:block}
.dchip .dn{font-size:14px;font-weight:800;display:block;color:var(--text)}
.dchip.on{background:var(--accent);border-color:var(--accent)}
.dchip.on .dw,.dchip.on .dn{color:#06241a}
.dchip .dot{width:4px;height:4px;border-radius:50%;background:var(--live);display:inline-block;margin-top:2px}
.fchip{border:1px solid var(--border);background:var(--surface);color:var(--muted);padding:7px 13px;border-radius:999px;
  font-size:13px;font-weight:600;white-space:nowrap;transition:.15s}
.fchip.on{background:var(--accent);border-color:var(--accent);color:#06241a}

/* ============================ CRESTS ============================ */
.crest{position:relative;display:inline-flex;flex-shrink:0;vertical-align:middle}
.crest-fb{position:absolute;inset:0;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-weight:800;letter-spacing:.01em;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.crest-img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))}

/* ============================ MATCH GROUPS / ROWS ============================ */
.mgroup{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:12px}
.ghead{display:flex;align-items:center;gap:9px;padding:11px 13px;background:var(--surface2);border-bottom:1px solid var(--border)}
.gbadge{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#fff;flex-shrink:0}
.gname{font-weight:700;font-size:13px}
.gcountry{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-left:auto}
.ghead.live{background:linear-gradient(90deg,rgba(240,65,63,.16),transparent)}
.ghead.live .gname{color:var(--live)}
.ghead.fav .gname{color:var(--gold)}
.mrow{display:flex;align-items:center;gap:10px;padding:9px 12px;border-top:1px solid var(--border-soft);transition:background .15s;cursor:pointer}
.mrow:first-child{border-top:0}
.mrow:active{background:var(--surface2)}
.mrow.logged{box-shadow:inset 3px 0 0 var(--accent)}
.mstat{width:38px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.25}
.mstat .min{color:var(--live);font-weight:800;font-size:11.5px;display:flex;align-items:center;gap:3px;text-align:center}
.mstat .ld{width:6px;height:6px;border-radius:50%;background:var(--live);animation:pulse 1.1s infinite;flex-shrink:0}
.mstat .ft{font-size:10.5px;font-weight:700;color:var(--faint)}
.mstat .tt{font-size:11.5px;font-weight:700;color:var(--muted)}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
.mteams{flex:1;min-width:0}
.tl{display:flex;align-items:center;gap:9px;padding:2.5px 0}
.tn{flex:1;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#d6dbe3}
.tsc{font-weight:800;font-variant-numeric:tabular-nums;font-size:15px;min-width:16px;text-align:right;color:#d6dbe3}
.tsc.dim{color:var(--faint)}
.tl.win .tn,.tl.win .tsc{color:#fff}
.tl.lose .tn,.tl.lose .tsc{color:var(--faint)}
.mside{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0}
.rate-pill{background:rgba(242,177,76,.15);color:var(--gold);font-weight:800;font-size:11px;padding:2px 7px;border-radius:999px}
.starb{background:none;border:0;color:#3c434f;padding:2px;line-height:0;transition:transform .15s,color .15s}
.starb.on{color:var(--gold)} .starb:active{transform:scale(1.3)}
.score-flash{animation:flash .8s ease}
@keyframes flash{0%{background:rgba(93,202,165,.25)}100%{background:transparent}}

/* ============================ LIVE CARDS ============================ */
.livecard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:12px;
  position:relative;overflow:hidden;cursor:pointer}
.livecard::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--live)}
.lc-top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.lc-badge{display:flex;align-items:center;gap:5px;background:var(--live);color:#fff;font-weight:800;font-size:11px;padding:3px 9px;border-radius:6px;letter-spacing:.05em}
.lc-badge .ld{width:6px;height:6px;border-radius:50%;background:#fff;animation:pulse 1.1s infinite}
.lc-clock{font-weight:800;color:var(--live);font-variant-numeric:tabular-nums}
.lc-league{margin-left:auto;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.lc-team{display:flex;align-items:center;gap:12px;padding:5px 0}
.lc-team .tn{font-size:16px;font-weight:700;color:#fff}
.lc-team .tsc{font-size:22px;font-weight:800}
.lc-ticker{margin-top:10px;border-top:1px solid var(--border-soft);padding-top:9px;font-size:12px;color:var(--muted);
  display:flex;align-items:center;gap:7px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.lc-ticker b{color:var(--text)}

/* ============================ MATCH DETAIL ============================ */
.dhead{position:sticky;top:0;z-index:30;background:var(--bg);padding:12px 14px 6px;display:flex;align-items:center;gap:12px}
.iconbtn{width:38px;height:38px;border-radius:11px;border:1px solid var(--border);background:var(--surface);color:var(--text);
  display:flex;align-items:center;justify-content:center}
.dhead .dt{font-weight:700;font-size:15px}
.hero{margin:4px 14px 0;background:radial-gradient(120% 90% at 50% 0,rgba(93,202,165,.08),transparent 60%),var(--surface);
  border:1px solid var(--border);border-radius:18px;padding:18px 14px}
.hero-top{display:flex;align-items:center;justify-content:center;gap:8px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:14px}
.hero-main{display:flex;align-items:flex-start;justify-content:space-between;gap:6px}
.hero-team{width:108px;display:flex;flex-direction:column;align-items:center;gap:9px;text-align:center}
.hero-team .tn{font-size:13px;font-weight:700;line-height:1.2}
.hero-mid{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:96px}
.hero-score{font-size:34px;font-weight:800;letter-spacing:.02em}
.hero-status{margin-top:4px;font-size:12px;font-weight:700;color:var(--muted)}
.hero-status.live{color:var(--live);display:flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums}
.hero-status .ld{width:7px;height:7px;border-radius:50%;background:var(--live);animation:pulse 1.1s infinite}
.hero-meta{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:14px;color:var(--muted);font-size:12px}
.ctx-chips{display:flex;gap:7px;justify-content:center;margin-top:12px}
.ctx{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;border:1px solid var(--border)}
.ctx.derby{color:var(--live);border-color:rgba(240,65,63,.4)}
.ctx.euro{color:var(--accent);border-color:rgba(93,202,165,.4)}
.tabs{display:flex;gap:6px;margin:14px 14px 0;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:4px}
.tabs button{flex:1;border:0;background:transparent;color:var(--muted);padding:10px;border-radius:9px;font-weight:700;font-size:13.5px;transition:.2s}
.tabs button.on{background:var(--elev);color:var(--text)}
.dbody{padding:8px 14px 0;animation:rise .22s ease both}
.info-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-top:12px}
.info-row{display:flex;align-items:center;justify-content:space-between;padding:13px;border-top:1px solid var(--border-soft);font-size:14px}
.info-row:first-child{border-top:0}
.info-row .k{color:var(--muted)} .info-row .v{font-weight:600}
.players-row{display:flex;align-items:center;gap:10px;padding:11px 13px;border-top:1px solid var(--border-soft)}
.players-row:first-child{border-top:0}
.pdot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex-shrink:0}

/* timeline */
.tml{padding:6px 13px 10px}
.tml-row{display:flex;align-items:flex-start;gap:10px;padding:7px 0;font-size:13px}
.tml-min{width:38px;flex-shrink:0;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.tml-ic{width:20px;flex-shrink:0;text-align:center}
.tml-txt b{font-weight:700}
/* H2H */
.h2h-row{display:flex;align-items:center;gap:10px;padding:11px 13px;border-top:1px solid var(--border-soft);font-size:13px}
.h2h-row:first-child{border-top:0}
.h2h-score{font-weight:800;font-variant-numeric:tabular-nums;margin-left:auto}
.wchip{width:20px;height:20px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;
  font-size:10.5px;font-weight:800;color:#fff;flex-shrink:0}

.label{font-weight:700;font-size:15px;margin:20px 2px 10px}
.stars{display:flex;gap:10px;justify-content:center;margin:8px 0}
.stars span{font-size:36px;color:#363c47;transition:transform .12s,color .15s;cursor:pointer}
.stars span.on{color:var(--gold)}
.stars span:active{transform:scale(1.25)}
.rate-label{text-align:center;font-weight:700;color:var(--gold);min-height:20px;font-size:15px}
textarea,input[type=text]{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:12px;color:var(--text);
  padding:13px;font-family:inherit;font-size:14px}
textarea{resize:vertical;min-height:78px}
textarea:focus,input[type=text]:focus{outline:none;border-color:var(--accent)}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:9px 13px;border-radius:999px;
  font-size:13px;font-weight:600;transition:.15s}
.pill.on{background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}
.loc-opts{display:flex;flex-direction:column;gap:10px}
.loc-opt{display:flex;align-items:center;gap:13px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;transition:.15s;cursor:pointer}
.loc-opt.on{border-color:var(--accent);background:var(--accent-dim)}
.loc-opt .lic{width:40px;height:40px;border-radius:11px;background:var(--surface2);display:flex;align-items:center;justify-content:center;color:var(--accent)}
.loc-opt.on .lic{background:rgba(93,202,165,.18)}
.loc-opt .nm{font-weight:700} .loc-opt .ck{margin-left:auto;color:var(--accent);opacity:0;transition:.15s}
.loc-opt.on .ck{opacity:1}
.venue-note{margin-top:14px;background:var(--surface);border:1px dashed var(--accent);border-radius:12px;padding:12px;
  color:var(--accent);font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;animation:rise .25s ease both}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.ptile{aspect-ratio:1;background:var(--surface2);border:1px dashed var(--border);border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--faint)}
.cta{width:100%;border:0;background:var(--accent);color:#06241a;font-weight:800;font-size:16px;padding:15px;border-radius:13px;margin:22px 0 6px;transition:transform .1s}
.cta:active{transform:scale(.985)} .cta.edit{background:var(--gold);color:#2a1900}
.cta.ghost{background:var(--surface);border:1px solid var(--border);color:var(--text)}
.cta:disabled{opacity:.45;cursor:not-allowed}
.your-log{background:linear-gradient(120deg,var(--accent-dim),var(--surface));border:1px solid var(--accent);border-radius:14px;padding:14px;margin-top:12px}
.your-log .yl-stars{color:var(--gold);font-size:16px;letter-spacing:1px}
.ns-note{margin-top:14px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;text-align:center;color:var(--muted);font-size:13px}

/* ============================ STATS / CHARTS ============================ */
.stat-hero{background:radial-gradient(130% 100% at 0 0,rgba(93,202,165,.12),transparent 55%),var(--surface);
  border:1px solid var(--border);border-radius:18px;padding:18px}
.stat-hero .big{font-size:46px;font-weight:800;line-height:1}
.mini-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.mini{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:13px;text-align:center}
.mini .v{font-size:22px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:5px}
.mini .k{font-size:11px;color:var(--muted);margin-top:2px}
.bar-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:15px;margin-top:12px}
.bar-line{display:flex;align-items:center;gap:10px;margin-top:11px}
.bar-line:first-of-type{margin-top:6px}
.bar-line .bl{width:86px;font-size:13px;font-weight:600;flex-shrink:0;display:flex;align-items:center;gap:7px;color:var(--text)}
.bar-line .bv{width:34px;text-align:right;font-size:12px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.sbar{flex:1;height:9px;background:var(--surface2);border-radius:0 4px 4px 0;overflow:hidden}
.sfill{height:100%;border-radius:0 4px 4px 0;transition:width .9s cubic-bezier(.22,1,.36,1)}
.swatch{width:9px;height:9px;border-radius:3px;flex-shrink:0}
/* IQ insight cards */
.iq-card{background:linear-gradient(135deg,rgba(93,202,165,.07),transparent 50%),var(--surface);
  border:1px solid var(--border);border-radius:14px;padding:14px;margin-top:10px;display:flex;gap:12px;align-items:flex-start}
.iq-ic{width:38px;height:38px;border-radius:11px;background:var(--accent-dim);color:var(--accent);
  display:flex;align-items:center;justify-content:center;flex-shrink:0}
.iq-t{font-weight:800;font-size:14px}
.iq-b{font-size:13px;color:var(--muted);margin-top:2px;line-height:1.5}
.iq-b b{color:var(--text)}
/* radar + donut layouts */
.chart-flex{display:flex;align-items:center;gap:14px;margin-top:8px}
.chart-legend{flex:1}
.cl-row{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13px}
.cl-row .cl-v{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;color:var(--text)}
.cl-row .cl-k{color:var(--muted)}

/* ============================ PROFILE ============================ */
.prof-card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:18px}
.prof-head{display:flex;align-items:center;gap:14px}
.avatar{width:62px;height:62px;border-radius:50%;background:linear-gradient(140deg,var(--accent),#2f7d64);
  display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;color:#06241a;box-shadow:0 0 0 4px rgba(93,202,165,.12)}
.prof-name{font-size:20px;font-weight:800}
.counters{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.counter{text-align:center} .counter .v{font-size:20px;font-weight:800} .counter .k{font-size:11px;color:var(--muted)}
.team-pill{display:inline-flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--border);
  border-radius:999px;padding:7px 13px 7px 7px;margin:0 8px 8px 0;font-size:13px;font-weight:600}
.team-pill .sp{font-size:11px;color:var(--muted)}
.set-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:4px 16px}
.set-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-top:1px solid var(--border-soft);gap:10px}
.set-row:first-child{border-top:0}
.tgl{width:46px;height:27px;border-radius:999px;background:var(--surface2);border:1px solid var(--border);position:relative;transition:.2s;cursor:pointer;flex-shrink:0}
.tgl.on{background:var(--accent)}
.tgl::after{content:"";position:absolute;top:2px;left:2px;width:21px;height:21px;border-radius:50%;background:#fff;transition:transform .2s}
.tgl.on::after{transform:translateX(19px)}
.danger{color:var(--live);font-weight:700;cursor:pointer}
.linkish{color:var(--accent);font-weight:700;cursor:pointer}
.mini-log{display:flex;align-items:center;gap:11px;padding:11px 0;border-top:1px solid var(--border-soft);cursor:pointer}
.mini-log:first-child{border-top:0}
.mini-log .ml-rt{margin-left:auto;color:var(--gold);font-size:13px;white-space:nowrap;font-weight:700}

/* ============================ BOTTOM NAV ============================ */
.bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;height:74px;

/* search overlay */

/* onboarding */

<div id="app"></div>
<script>
/* =============================================================================
   BLEACHERS v3 - a living Flashscore-style tracker with a Letterboxd twist
   -----------------------------------------------------------------------------
   What's inside (single file, vanilla JS, no build step, localStorage only):

   • LIVE ENGINE - in-play matches actually play out while the app is open:
     the clock ticks, goals/baskets land, events append to a timeline, matches
     go to full-time. Session-only by design (a refresh restarts the demo day).
   • FIXTURE CALENDAR - matches are generated relative to the real "today"
     across a 5-day strip (finished, live and upcoming), grouped by league.
   • MATCH LOGGING - rate (1-5), review, Player of the Match, and "The
     Experience" (stadium/home/bar, atmosphere, memory note). Editing updates
     in place. Upcoming matches cannot be logged.
   • ΠΑΛΜΟΣ (Hype Index) - a live 0-100 "is this match worth opening right
     now" score per in-play match (closeness + stakes + scoring bursts +
     derby weight), with a per-match pulse graph, fire-alerts when a match
     crosses 80, and live scores ticking in the browser-tab title.
   • ΠΡΟΒΛΕΨΕΙΣ - live micro-predictions ("who scores next?" / "who leads
     the quarter?") that the match engine itself settles, with streaks and
     accuracy stats.
   • ΣΤΙΓΜΕΣ - one-tap bookmarking of the exact live second you're watching
     (clock, score, latest event) into your personal match diary.
   • KICKOFF BRIEF - an auto-written daily digest on the feed: what's live
     and how hot, what's on tonight, when your favourite team plays next.
   • MATCH CHAT - every match has a chat room that unlocks exactly 60
     minutes before kickoff (countdown until then), where a simulated crowd
     of both fanbases reacts live to the engine's real goals and baskets;
     your own messages persist locally, finished matches keep a read only
     archive. (True cross device chat would need a server; this demo has
     no backend by design.)
   • BLEACHERS IQ - a rule-based insights engine that turns your logs into
     natural-language findings (in Greek), plus a taste radar, a where-you-
     watched donut and rating charts. Chart colors are validated for contrast
     and color-vision safety on the dark surface.
   • H2H - head-to-head history between the two clubs, from the dataset.
   • Onboarding, search, swipe navigation, export/import backup, migration
     from the v2 storage key.

   Team logos load from public CDNs (api-sports / TheSportsDB) - every URL was
   verified - with an instant coloured-monogram fallback for offline use.

   Code map: (1) DATA & STATE  (2) LIVE ENGINE  (3) INSIGHTS & CHART MATH
             (4) RENDER / SCREENS  (5) ACTIONS  (6) NAVIGATION & INIT
============================================================================= */

/* =============================================================================
   (1) DATA & STATE
============================================================================= */

function pushEvent(m, min, type, teamSide, text){

/* --- Παλμός (Hype Index): how much a live match deserves your attention RIGHT
       NOW, 0-100. Closeness + stakes (how late it is) + recent scoring bursts
       + derby/euro weight. This is the "open the app" signal. --- */
function hypeOf(m){
  if(m.status!=='live') return 0;
  let h = 28;
  const diff = Math.abs(m.score.home - m.score.away);
  if(m.sport==='football'){
    h += diff===0 ? 26 : diff===1 ? 18 : diff===2 ? 4 : -14;   // blowouts cool off
    h += Math.min(24, m.liveMin/90*24);
    const burst = m.events.filter(e=>e.type==='goal' && (m.liveMin - e.min) <= 12).length;
    h += burst*12;
    if(m.liveMin>=85 && diff<=1) h += 10;         // late drama
  } else {
    h += diff<=3 ? 26 : diff<=6 ? 15 : diff<=10 ? 2 : -18;     // blowouts cool off
    h += (Math.min(m.liveQ,4)-1)*7 + (600-Math.max(0,Math.min(600,m.liveSec)))/600*7;
    if(m.liveQ>=4 && diff<=5) h += 16;            // clutch time
    if(m.liveQ>4) h = Math.max(h, 88);            // overtime
  }
  if(m.derby) h += 8;
  if(m.euro)  h += 4;
  return Math.max(5, Math.min(100, Math.round(h)));
}
function hypeCls(h){ return h>=80 ? 'fire' : h>=55 ? 'warm' : ''; }

/* --- Το Ματς της Ημέρας: the app crowns the day's biggest fixture per sport
       (derby weight, euro nights, your teams, live bonus). Logging today's
       crowned match keeps a daily streak alive. --- */
function motdOf(day, sport){
  const cands = MATCHES.filter(m=>m.day===day && m.sport===sport);
  if(!cands.length) return null;
  const fav = id => state.user.favoriteTeams.indexOf(id)>-1;
  const sc = m => (m.derby?3:0) + (m.euro?2:0) + ((fav(m.homeId)||fav(m.awayId))?2:0) + (m.status==='live'?1:0);
  return cands.slice().sort((a,b)=>sc(b)-sc(a))[0];
}
/* =============================================================================
   MATCH CHAT ENGINE
   Every match has a chat room that unlocks exactly 60 minutes before kickoff
   (a countdown shows until then), runs through the live match with a simulated
   crowd reacting to the REAL engine events, and becomes a read only archive at
   full time. Your own messages persist in localStorage; the crowd is generated
   per session (this demo has no server, so there are no real remote users).
============================================================================= */
const CHAT_OPEN_MS = 60*60*1000;   // opens 1 hour before kickoff

function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function seedOf(id){ let h=0; for(let i=0;i<id.length;i++) h=(h*31+id.charCodeAt(i))|0; return h; }

function kickoffMs(m){
  const p = m.time.split(':');
  const d = dayDate(m.day);
  d.setHours(+p[0], +p[1], 0, 0);
  return d.getTime();
}
/* 'locked' (countdown) | 'open' (1h before + live) | 'archive' (full time) */
function chatState(m, now){
  now = now==null ? Date.now() : now;
  if(m.status==='ft') return 'archive';
  if(m.status==='live') return 'open';
  return now >= kickoffMs(m) - CHAT_OPEN_MS ? 'open' : 'locked';
}
function fmtCountdown(ms){
  if(ms <= 0) return '00:00';
  const s = Math.floor(ms/1000);
  const d = Math.floor(s/86400), h = Math.floor((s%86400)/3600), mn = Math.floor((s%3600)/60);
  if(d>0) return d+'μ '+h+'ω';
  if(h>0) return h+'ω '+pad(mn)+'λ';
  return pad(mn)+':'+pad(s%60);
}
function membersOf(m){
  const r = mulberry32(seedOf(m.id));
  let n = 40 + Math.floor(r()*70) + (m.derby?45:0) + (m.euro?25:0);
  if(m.status==='live') n += (m.sport==='football' ? m.liveMin : (m.liveQ*10)) * 2;
  return n;
}
function chatFans(m){
  if(m._fans) return m._fans;
  const r = mulberry32(seedOf(m.id)+7);
  const pool = PERSONAS.slice();
  const fans = [];
  const count = 8 + Math.floor(r()*4);
  for(let i=0;i<count && pool.length;i++){
    const idx = Math.floor(r()*pool.length);
    fans.push({ name:pool.splice(idx,1)[0], side: r()<0.5?'home':'away' });
  }
  m._fans = fans;
  return fans;
}
function chatPush(m, msg){
  m.chatLog.push(Object.assign({ id:++m._chatSeq }, msg));
  if(m.chatLog.length>140) m.chatLog.splice(0, m.chatLog.length-140);
}
function fill(tpl, m, scorer){
  return tpl.replace('{H}', m.home.name).replace('{A}', m.away.name).replace('{S}', scorer||m.players[0]);
}
function fanMsg(m, side, text, tm){
  const fans = chatFans(m).filter(f=>side?f.side===side:true);
  const r = m._rng || (m._rng = mulberry32(seedOf(m.id)+42));
  const f = fans.length ? fans[Math.floor(r()*fans.length)] : { name:'Fan', side:side||'home' };
  chatPush(m, { who:'fan', name:f.name, side:f.side, text, tm:tm||'' });
}
function pick(r, arr){ return arr[Math.floor(r()*arr.length)]; }

/* Build the room on first open: pregame hype, or a full archive for finished
   matches; then re inject YOUR saved messages from localStorage. */
function ensureChat(m){
  if(m.chatLog) return;
  m.chatLog = []; m._chatSeq = 0;
  const r = m._rng = mulberry32(seedOf(m.id)+42);
  const st = chatState(m);
  const hhmm = ms => { const d=new Date(ms); return pad(d.getHours())+':'+pad(d.getMinutes()); };
  const ko = kickoffMs(m);
  if(st==='open' || st==='archive'){
    const n = 4 + Math.floor(r()*3);
    for(let i=0;i<n;i++){
      fanMsg(m, null, fill(pick(r,CHAT_PRE), m), hhmm(ko - CHAT_OPEN_MS + i*7*60*1000 + r()*5*60*1000));
    }
  }
  if(st==='archive'){
    const goals = m.sport==='football' ? m.score.home + m.score.away : 6;
    for(let i=0;i<goals;i++){
      const side = m.sport==='football'
        ? (i < m.score.home ? 'home' : 'away')
        : (r()<0.5?'home':'away');
      const tpl = m.sport==='football' ? pick(r,CHAT_GOAL_FOR) : pick(r,CHAT_BASKET);
      fanMsg(m, side, fill(tpl, m, pick(r,m.players)), Math.min(88, 8+Math.floor(i*(80/Math.max(1,goals))+r()*8))+'′');
      if(m.sport==='football' && r()<0.7) fanMsg(m, side==='home'?'away':'home', fill(pick(r,CHAT_GOAL_VS),m), '');
    }
    fanMsg(m, null, pick(r,CHAT_FT), '90′');
    chatPush(m, { who:'sys', text:'Το chat έκλεισε στο τέλος του αγώνα', tm:'' });
  }
  if(st==='open' && m.status==='live'){
    fanMsg(m, null, fill(pick(r,CHAT_LIVE), m), liveClock(m));
  }
  (state.chat[m.id]||[]).forEach(um=>{ chatPush(m, { who:'me', name:state.user.name||'Εσύ', side:null, text:um.text, tm:um.tm||'' }); });
}
/* Crowd reacts to REAL engine events (called from pushEvent). */
function chatOnEvent(m, type, side, text){
  if(chatState(m)==='locked') return;
  ensureChat(m);
  const r = m._rng;
  if(type==='goal'){
    const scorer = (text.split('ΓΚΟΛ! ')[1]||'').split(',')[0] || null;
    fanMsg(m, side, fill(pick(r,CHAT_GOAL_FOR), m, scorer), liveClock(m));
    fanMsg(m, side, fill(pick(r,CHAT_GOAL_FOR), m, scorer), liveClock(m));
    fanMsg(m, side==='home'?'away':'home', fill(pick(r,CHAT_GOAL_VS), m), liveClock(m));
  } else if(type==='basket'){
    if(r()<0.55){ const scorer=(text.split(',')[0]||'').trim(); fanMsg(m, side, fill(pick(r,CHAT_BASKET), m, scorer), liveClock(m)); }
  } else if(type==='period'){
    fanMsg(m, null, pick(r,CHAT_PERIOD), liveClock(m));
  } else if(type==='yellow'){
    if(r()<0.35) fanMsg(m, side==='home'?'away':'home', 'Επιτέλους κάρτα εκεί', liveClock(m));
  } else if(type==='ft'){
    fanMsg(m, 'home', pick(r,CHAT_FT), 'FT');
    fanMsg(m, 'away', pick(r,CHAT_FT), 'FT');
    chatPush(m, { who:'sys', text:'Το chat έκλεισε στο τέλος του αγώνα', tm:'' });
  }
}
/* Ambient banter between events while live. */
function chatTick(m){
  if(m.status!=='live' || !m.chatLog) return false;
  const r = m._rng;
  if(r() < 0.38){ fanMsg(m, null, fill(pick(r,CHAT_LIVE), m), liveClock(m)); return true; }
  return false;
}
function sendChat(){
  const m = matchById(App.ui.chatMatch);
  if(!m) return;
  const st = chatState(m);
  if(st!=='open') return;
  const text = (App.ui.chatInput||'').trim();
  if(!text) return;
  ensureChat(m);
  const tm = m.status==='live' ? liveClock(m) : 'πριν τη σέντρα';
  chatPush(m, { who:'me', name:state.user.name||'Εσύ', side:null, text, tm });
  if(!state.chat[m.id]) state.chat[m.id]=[];
  state.chat[m.id].push({ text, tm, ts:Date.now() });
  if(state.chat[m.id].length>100) state.chat[m.id].shift();
  App.ui.chatInput=''; App.ui.chatFocus=true;
  save(); buzz(12); render();
}

function bumpMotdStreak(matchId){
  const mf = motdOf(0,'football'), mb = motdOf(0,'basketball');
  if(!((mf&&matchId===mf.id) || (mb&&matchId===mb.id))) return;
  const today = dateStrOf(new Date());
  if(state.motd.lastDate===today) return;
  const y = new Date(); y.setDate(y.getDate()-1);
  state.motd.streak = state.motd.lastDate===dateStrOf(y) ? state.motd.streak+1 : 1;
  state.motd.lastDate = today;
  if(state.motd.streak > state.motd.best) state.motd.best = state.motd.streak;
  toast('trophy','Κατέγραψες το Ματς της Ημέρας! Σερί '+state.motd.streak+' 🔥');
}

/* --- In-app toasts (prediction results, hype alerts, saved moments). --- */
let toastSeq = 0;
function toast(icn, text, hot){
  App.ui.toasts.push({ id:++toastSeq, icn, text, hot:!!hot });
  if(App.ui.toasts.length>3) App.ui.toasts.shift();
  if(safeToRerender()) render();
  const id = toastSeq;
  setTimeout(()=>{
    App.ui.toasts = App.ui.toasts.filter(t=>t.id!==id);
    if(safeToRerender()) render();
  }, 4200);
}

/* --- Live predictions: one active pick per match, resolved BY the engine. --- */
function placePrediction(matchId, pick){
  const m = matchById(matchId);
  if(!m || m.status!=='live') return;
  state.predictions[matchId] = m.sport==='football'
    ? { pick, at:m.liveMin, resolved:false, correct:null, void:false }
    : { pick, q:m.liveQ,    resolved:false, correct:null, void:false };
  save(); buzz(15); render();
}
function resolvePrediction(m, correct, isVoid){
  const p = state.predictions[m.id];
  if(!p || p.resolved) return;
  p.resolved = true; p.void = !!isVoid; p.correct = isVoid ? null : correct;
  const st = state.predStats;
  if(isVoid){
    toast('target', 'Ισοπαλία στην περίοδο, η πρόβλεψη ακυρώθηκε');
  } else {
    st.total++;
    if(correct){
      st.correct++; st.streak++;
      if(st.streak > st.best) st.best = st.streak;
      toast('target', 'Σωστή πρόβλεψη! Σερί '+st.streak+' 🔥'); buzz(40);
    } else {
      st.streak = 0;
      toast('target', 'Άστοχη πρόβλεψη, μηδένισε το σερί');
    }
  }
  save();
}

/* One simulation step for a football match. */
function tickFootball(m){
  m.liveMin += Math.random()<0.5 ? 1 : 2;
  const p = state.predictions[m.id];
  /* "no goal in 15'" window expiry */
  if(p && !p.resolved && p.at!=null && (m.liveMin - p.at) >= 15){
    resolvePrediction(m, p.pick==='none');
  }
  const r = Math.random();
  if(r < 0.045){                                     // goal
    const homeP = 0.5 + (m.home.str - m.away.str);
    const side = Math.random() < homeP ? 'home' : 'away';
    m.score[side]++;
    const scorer = m.players[Math.floor(Math.random()*m.players.length)];
    pushEvent(m, m.liveMin, 'goal', side, 'ΓΚΟΛ! '+scorer+', '+m[side].name);
    if(p && !p.resolved) resolvePrediction(m, p.pick===side);
    buzz(60);
    return true;
  } else if(r < 0.085){                              // yellow card
    const side = Math.random()<0.5?'home':'away';
    pushEvent(m, m.liveMin, 'yellow', side, 'Κίτρινη κάρτα ('+m[side].abbr+')');
  }
  if(m.liveMin >= 90 + Math.floor(Math.random()*5)){ // full time
    m.status='ft';
    pushEvent(m, 90, 'ft', null, 'Τέλος αγώνα '+m.score.home+'-'+m.score.away);
    if(p && !p.resolved) resolvePrediction(m, p.pick==='none');
    return true;
  }
  return false;
}
/* One simulation step for a basketball match. */
function tickBasketball(m){
  m.liveSec -= 20 + Math.floor(Math.random()*25);
  let scored = false;
  for(const side of ['home','away']){
    const p = 0.38 + (m[side].str - m[side==='home'?'away':'home'].str)*0.3;
    if(Math.random() < p){
      const pts = Math.random()<0.3 ? 3 : 2;
      m.score[side]+=pts; scored = true;
      if(Math.random()<0.22){
        const scorer = m.players[Math.floor(Math.random()*m.players.length)];
        pushEvent(m, 'Q'+m.liveQ, 'basket', side, scorer+' - '+pts+'π. ('+m[side].abbr+')');
      }
    }
  }
  if(m.liveSec <= 0){
    /* period ends: resolve any "who leads at the end of this quarter" pick */
    const p = state.predictions[m.id];
    if(p && !p.resolved && p.q===m.liveQ){
      const lead = m.score.home>m.score.away ? 'home' : (m.score.away>m.score.home ? 'away' : null);
      if(lead===null) resolvePrediction(m, false, true);   // tie → void
      else resolvePrediction(m, p.pick===lead);
    }
    if(m.liveQ >= 4){
      if(m.score.home === m.score.away){ m.liveQ++; m.liveSec=300; pushEvent(m,'OT','period',null,'Παράταση!'); }
      else{ m.status='ft'; pushEvent(m,'FT','ft',null,'Τέλος αγώνα '+m.score.home+'-'+m.score.away); }
    } else { m.liveQ++; m.liveSec=600; pushEvent(m,'Q'+m.liveQ,'period',null,'Αρχή '+m.liveQ+'ης περιόδου'); }
    return true;
  }
  return scored;
}
function liveClock(m){
  if(m.sport==='football') return m.liveMin+'′';
  const s = Math.max(0,m.liveSec);
  return (m.liveQ>4?'OT':'Q'+m.liveQ)+' '+pad(Math.floor(s/60))+':'+pad(s%60);
}
/* Re-render only when it's safe (never yank the keyboard/caret or an open sheet).
   The chat input is the exception: its value and caret are restored after every
   render, so live messages keep flowing while you type. */
function safeToRerender(){
  const ae = document.activeElement;
  if(ae && (ae.tagName==='TEXTAREA' || ae.tagName==='INPUT') && ae.id!=='chatbox') return false;
  if(App.ui.modal || App.ui.sheet || App.ui.search!==null || !state.onboarded) return false;
  return true;
}
function simTick(){
  if(document.hidden) return;
  const live = liveMatches();
  if(!live.length){ try{ document.title='Bleachers'; }catch(e){} return; }
  let changed = false;
  live.forEach(m=>{ changed = (m.sport==='football'?tickFootball(m):tickBasketball(m)) || changed; });
  /* Παλμός: record history + alert when a match catches fire */
  MATCHES.forEach(m=>{
    if(m.status!=='live') return;
    const h = hypeOf(m);
    m.hypeLog.push(h);
    if(m.hypeLog.length>90) m.hypeLog.shift();
    const watchingThis = App.ui.screen==='live' || (App.ui.screen==='matchDetail' && App.ui.draft && App.ui.draft.matchId===m.id);
    if(h>=80 && (m._hypePrev||0)<80 && !watchingThis){
      toast('fire', esc(m.home.abbr)+'-'+esc(m.away.abbr)+' άναψε! Παλμός '+h+', άνοιξέ το', true);
      buzz(30);
    }
    m._hypePrev = h;
  });
  /* Live scores in the browser tab - the app pulls you back even minimised. */
  try{
    document.title = liveMatches().map(m=>(m.sport==='football'?'⚽':'🏀')+' '+m.home.abbr+' '+m.score.home+'-'+m.score.away+' '+m.away.abbr).join(' · ') || 'Bleachers';
  }catch(e){}
  /* ambient chat banter between events */
  let chatted = false;
  liveMatches().forEach(m=>{ if(m.chatLog) chatted = chatTick(m) || chatted; });
  const s = App.ui.screen;
  const watching = s==='feed'||s==='live'||s==='picker'||s==='matchChat'||(s==='matchDetail'&&App.ui.draft&&matchById(App.ui.draft.matchId));
  if((changed || chatted || s==='matchChat') && watching && safeToRerender()) render();
  else if(watching && safeToRerender()) patchClocks();
}
/* Cheap DOM patch for ticking clocks + hype values between full renders. */
function patchClocks(){
  document.querySelectorAll('[data-clock]').forEach(el=>{
    const m = matchById(el.getAttribute('data-clock'));
    if(m && m.status==='live') el.textContent = liveClock(m);
  });
  document.querySelectorAll('[data-hype]').forEach(el=>{
    const m = matchById(el.getAttribute('data-hype'));
    if(m && m.status==='live') el.textContent = hypeOf(m);
  });
  document.querySelectorAll('[data-chatcount]').forEach(el=>{
    const m = matchById(el.getAttribute('data-chatcount'));
    if(m) el.textContent = fmtCountdown(kickoffMs(m) - CHAT_OPEN_MS - Date.now());
  });
}
function startSim(){ if(!SIM.timer) SIM.timer = setInterval(simTick, SIM.tickMs); }

/* =============================================================================
   (3) INSIGHTS ("Bleachers IQ") & CHART MATH
============================================================================= */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function matchById(id){ return MATCHES.find(m=>m.id===id); }
function logsArr(){ return Object.values(state.logs); }
function ratedLogs(){ return logsArr().filter(l=>l.rating); }
function avg(arr){ return arr.length ? arr.reduce((a,b)=>a+b,0)/arr.length : 0; }
function avgRating(logs){ return avg(logs.filter(l=>l.rating).map(l=>l.rating)); }

/* Rule-based natural-language findings. Each rule returns null or a card. */
function computeInsights(){
  const logs = ratedLogs();
  const out = [];
  if(logs.length < 2){
    out.push({ icon:'spark', title:'Το IQ σου ζεσταίνεται', body:'Κατέγραψε τουλάχιστον <b>2 αγώνες</b> για να αρχίσουν οι αναλύσεις σου.' });
    return out;
  }
  const withM = logs.map(l=>({ l, m:matchById(l.matchId) })).filter(x=>x.m);
  const derby = withM.filter(x=>x.m.derby), nonDerby = withM.filter(x=>!x.m.derby);
  if(derby.length && nonDerby.length){
    const d = avg(derby.map(x=>x.l.rating)) - avg(nonDerby.map(x=>x.l.rating));
    if(d >= 0.5) out.push({ icon:'fire', title:'Ζεις για τα ντέρμπι', body:'Βαθμολογείς τα ντέρμπι <b>+'+d.toFixed(1)+'★</b> ψηλότερα από τους υπόλοιπους αγώνες.' });
    else if(d <= -0.5) out.push({ icon:'fire', title:'Υπερτιμημένα ντέρμπι;', body:'Βαθμολογείς τα ντέρμπι <b>'+d.toFixed(1)+'★</b> χαμηλότερα, ο αντικειμενικός θεατής.' });
  }
  const stad = logs.filter(l=>l.location==='stadium'), rest = logs.filter(l=>l.location && l.location!=='stadium');
  if(stad.length && rest.length){
    const d = avg(stad.map(l=>l.rating)) - avg(rest.map(l=>l.rating));
    if(d >= 0.5) out.push({ icon:'pin', title:'Το γήπεδο σε απογειώνει', body:'Οι αγώνες που είδες live παίρνουν <b>+'+d.toFixed(1)+'★</b> σε σχέση με καναπέ και μπαρ.' });
  }
  const fb = withM.filter(x=>x.m.sport==='football').length, total = withM.length;
  const share = fb/total;
  if(total>=3 && share>=0.7) out.push({ icon:'ball', title:'Ποδοσφαιρόφιλος στην καρδιά', body:'Το <b>'+Math.round(share*100)+'%</b> των καταγραφών σου είναι ποδόσφαιρο.' });
  else if(total>=3 && share<=0.3) out.push({ icon:'ball', title:'Παρκέ πάνω απ’ όλα', body:'Το <b>'+Math.round((1-share)*100)+'%</b> των καταγραφών σου είναι μπάσκετ.' });
  const revRate = logs.filter(l=>l.review && l.review.trim()).length / logs.length;
  if(logs.length>=3 && revRate>=0.6) out.push({ icon:'pen', title:'Ο κριτικός', body:'Γράφεις κριτική στο <b>'+Math.round(revRate*100)+'%</b> των αγώνων σου, πάνω από κάθε μέσο όρο.' });
  const close = withM.filter(x=>Math.abs(x.m.score.home-x.m.score.away) <= (x.m.sport==='football'?1:4));
  const blow  = withM.filter(x=>Math.abs(x.m.score.home-x.m.score.away) >  (x.m.sport==='football'?1:4));
  if(close.length && blow.length){
    const d = avg(close.map(x=>x.l.rating)) - avg(blow.map(x=>x.l.rating));
    if(d >= 0.5) out.push({ icon:'bolt', title:'Θες ματς-θρίλερ', body:'Τα ντέρμπι σκορ (μικρή διαφορά) τα βαθμολογείς <b>+'+d.toFixed(1)+'★</b> πάνω από τις "περίπατο" νίκες.' });
  }
  const euro = withM.filter(x=>x.m.euro);
  if(euro.length>=2){
    const d = avg(euro.map(x=>x.l.rating)) - avgRating(logs);
    if(d >= 0.4) out.push({ icon:'star', title:'Euro nights person', body:'Οι ευρωπαϊκές βραδιές σου παίρνουν <b>+'+d.toFixed(1)+'★</b> από τον μέσο όρο σου.' });
  }
  const ps = state.predStats;
  if(ps.total>=5 && ps.correct/ps.total>=0.6){
    out.push({ icon:'target', title:'Ο προφήτης', body:'Πετυχαίνεις το <b>'+Math.round(ps.correct/ps.total*100)+'%</b> των live προβλέψεών σου ('+ps.correct+'/'+ps.total+').' });
  }
  if(!out.length) out.push({ icon:'spark', title:'Ισορροπημένο προφίλ', body:'Έχεις <b>'+logs.length+'</b> καταγραφές με μέσο όρο <b>'+avgRating(logs).toFixed(1)+'★</b>, συνέχισε για βαθύτερα insights.' });
  return out.slice(0,3);
}

/* Taste radar axes, each normalised 0..1. */
function computeRadar(){
  const logs = logsArr();
  const withM = logs.map(l=>({ l, m:matchById(l.matchId) })).filter(x=>x.m);
  const n = logs.length || 1;
  const leagues = new Set(withM.map(x=>x.m.league)).size;
  return [
    { k:'Πάθος',     v:Math.min(1, logs.length/8) },
    { k:'Κριτικός',  v:logs.filter(l=>l.review&&l.review.trim()).length/n },
    { k:'Γήπεδο',    v:logs.filter(l=>l.location==='stadium').length/n },
    { k:'Ντέρμπι',   v:withM.filter(x=>x.m.derby).length/n },
    { k:'Ευρώπη',    v:withM.filter(x=>x.m.euro).length/n },
    { k:'Ποικιλία',  v:Math.min(1, leagues/4) },
  ];
}
/* SVG radar - single series: 2px accent line, ~10% wash, labels in text tokens.
   The viewBox carries extra horizontal padding so side labels never clip. */
function radarSVG(axes, size){
  const S = size||240, PAD=62, W=S+PAD*2, cx=W/2, cy=S/2, R=S*0.34;
  const pt = (i, r) => { const a = -Math.PI/2 + i*2*Math.PI/axes.length; return [cx + r*Math.cos(a), cy + r*Math.sin(a)]; };
  let grid = '';
  [0.33,0.66,1].forEach(g=>{
    const pts = axes.map((_,i)=>pt(i,R*g).join(',')).join(' ');
    grid += '<polygon points="'+pts+'" fill="none" stroke="#272d38" stroke-width="1"/>';
  });
  let spokes = axes.map((_,i)=>{ const [x,y]=pt(i,R); return '<line x1="'+cx+'" y1="'+cy+'" x2="'+x+'" y2="'+y+'" stroke="#272d38" stroke-width="1"/>'; }).join('');
  const dataPts = axes.map((a,i)=>pt(i, R*Math.max(0.04,a.v)));
  const poly = dataPts.map(p=>p.join(',')).join(' ');
  const dots = dataPts.map(p=>'<circle cx="'+p[0]+'" cy="'+p[1]+'" r="3.5" fill="#5DCAA5" stroke="#161a20" stroke-width="2"/>').join('');
  const labels = axes.map((a,i)=>{
    const [x,y] = pt(i, R+20);
    let anchor = Math.abs(x-cx)<8 ? 'middle' : (x>cx?'start':'end');
    return '<text x="'+x+'" y="'+(y+4)+'" text-anchor="'+anchor+'" font-size="11" font-weight="600" fill="#8a93a3">'+esc(a.k)+'</text>';
  }).join('');
  return '<svg viewBox="0 0 '+W+' '+S+'" width="100%" role="img" aria-label="Ραντάρ προφίλ θεατή">'
    + grid + spokes
    + '<polygon points="'+poly+'" fill="rgba(93,202,165,.12)" stroke="#5DCAA5" stroke-width="2" stroke-linejoin="round"/>'
    + dots + labels + '</svg>';
}
/* SVG donut - part-to-whole (3 segments max here), 2px surface gaps, hero center. */
function donutSVG(parts, total){
  const S=140, cx=S/2, cy=S/2, r=52, C=2*Math.PI*r;
  let off = -C/4, segs='';
  parts.forEach(p=>{
    if(!p.v) return;
    const len = p.v/total*C;
    segs += '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+p.c+'" stroke-width="14" '
      + 'stroke-dasharray="'+Math.max(0,len-2)+' '+(C-len+2)+'" stroke-dashoffset="'+(-off)+'"/>';
    off += len;
  });
  return '<svg viewBox="0 0 '+S+' '+S+'" width="132" role="img" aria-label="Πού είδες τους αγώνες">'
    + '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="#1d222b" stroke-width="14"/>' + segs
    + '<text x="'+cx+'" y="'+(cy-2)+'" text-anchor="middle" font-size="26" font-weight="800" fill="#eef1f5">'+total+'</text>'
    + '<text x="'+cx+'" y="'+(cy+16)+'" text-anchor="middle" font-size="10" fill="#8a93a3">αγώνες</text>'
    + '</svg>';
}

/* Hype sparkline - single series (2px accent line, ring-guarded end dot). */
function sparkSVG(vals){
  if(!vals || vals.length<2) return '';
  const W=300, H=58, P=7;
  const pts = vals.map((v,i)=>[
    P + i*(W-2*P)/(vals.length-1),
    H - P - (Math.max(0,Math.min(100,v))/100)*(H-2*P)
  ]);
  const line = pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const last = pts[pts.length-1];
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Παλμός αγώνα στον χρόνο">'
    + '<line x1="'+P+'" y1="'+(H-P-(80/100)*(H-2*P)).toFixed(1)+'" x2="'+(W-P)+'" y2="'+(H-P-(80/100)*(H-2*P)).toFixed(1)+'" stroke="#272d38" stroke-width="1"/>'
    + '<polyline points="'+line+'" fill="none" stroke="#5DCAA5" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'
    + '<circle cx="'+last[0].toFixed(1)+'" cy="'+last[1].toFixed(1)+'" r="4" fill="#5DCAA5" stroke="#161a20" stroke-width="2"/>'
    + '</svg>';
}

/* Logos are preloaded once at startup; a crest only renders its <img> after the
   URL is known-good, so the fallback monogram never flashes and the constant
   live-engine re-renders (innerHTML) can't kill an in-flight download. */
const LOGO_STATE = {};   // url -> 'ok' | 'fail'
let logoRefreshT = null;
function logoRefresh(){
  clearTimeout(logoRefreshT);
  logoRefreshT = setTimeout(()=>{
    const ae = document.activeElement;
    if(ae && (ae.tagName==='TEXTAREA'||ae.tagName==='INPUT')) return;
    if(App.ui.modal || App.ui.sheet || App.ui.search!==null) return;
    render();
  }, 250);
}
function preloadLogos(){
  if(!document.body || !document.body.appendChild) return;   // non-browser environment
  /* Real <img> nodes in a hidden holder OUTSIDE #app: innerHTML re-renders can't
     abort them, and once loaded the visible crests hit the warm cache instantly. */
  const holder = document.createElement('div');
  holder.setAttribute('aria-hidden','true');
  holder.style.cssText = 'position:absolute;width:0;height:0;overflow:hidden;visibility:hidden';
  const urls = Object.values(TEAMS).map(t=>t.logo)
    .concat(Object.values(LEAGUE_META).map(l=>l.logo));
  new Set(urls.filter(Boolean)).forEach(u=>{
    const im = document.createElement('img');
    im.onload  = ()=>{ LOGO_STATE[u]='ok'; logoRefresh(); };
    im.onerror = ()=>{ LOGO_STATE[u]='fail'; };
    im.src = u;
    holder.appendChild(im);
  });
  document.body.appendChild(holder);
}
/* Flashscore-style crest: the transparent club logo floats on its own - no
   circle, no plate behind it. The coloured monogram appears ONLY while the
   logo hasn't loaded (or offline), then disappears entirely. */
function crest(team, size){
  const s = size||40;
  if(team.logo && LOGO_STATE[team.logo]==='ok'){
    return '<span class="crest" style="width:'+s+'px;height:'+s+'px"><img class="crest-img" src="'+team.logo+'" alt=""></span>';
  }
  return '<span class="crest" style="width:'+s+'px;height:'+s+'px">'
    + '<span class="crest-fb" style="background:'+team.color+';color:'+textColorFor(team.color)+';font-size:'+Math.round(s*0.34)+'px">'+esc(team.abbr)+'</span></span>';
}
/* Competition badge: the real league/tournament logo once loaded, otherwise
   the coloured-initials chip. */
function leagueBadge(league, size){
  const s = size||22;
  const meta = LEAGUE_META[league]||{};
  if(meta.logo && LOGO_STATE[meta.logo]==='ok'){
    return '<span class="lg-badge" style="width:'+s+'px;height:'+s+'px">'
      + '<img src="'+meta.logo+'" alt="'+esc(league)+'"></span>';
  }
  const initials = league.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
  return '<span class="gbadge" style="background:'+(meta.color||'var(--faint)')+';width:'+s+'px;height:'+s+'px">'+esc(initials)+'</span>';
}
function starsGlyph(n){ let o=''; for(let i=1;i<=5;i++) o += (i<=n?'★':'☆'); return o; }
function fmtDay(d){ return GRDAYS[d.getDay()]+' '+d.getDate()+' '+GRMON[d.getMonth()]; }

function topBar(){
  const live = liveMatches().length;
  return '<div class="topbar">'

    + '<button class="tb-av" data-action="nav" data-screen="profile" aria-label="Προφίλ">'+esc((state.user.name||'B')[0].toUpperCase())+'</button>'
    + '</div></div>';
}

/* ---------- FEED ---------- */
function teamLine(m, side){
  const team = m[side], score = m.score[side];
  let cls='';
  if(m.status==='ft'){
    const mine=m.score[side], other=m.score[side==='home'?'away':'home'];
    cls = mine>other?'win':(mine<other?'lose':'');
  }
  const sc = m.status==='ns' ? '<span class="tsc dim">·</span>' : '<span class="tsc">'+score+'</span>';
  /* origin tag when the club plays outside its domestic league (e.g. CL) */
  const dom = (team.dom && team.dom!==m.league) ? '<span class="dom-tag">'+esc(team.dom)+'</span>' : '';
  return '<div class="tl '+cls+'">'+crest(team,26)+'<span class="tn">'+esc(team.name)+'</span>'+dom+sc+'</div>';
}
function statusCol(m){
  if(m.status==='live') return '<span class="min"><span class="ld"></span><span data-clock="'+m.id+'">'+esc(liveClock(m))+'</span></span>';
  if(m.status==='ns')   return '<span class="tt">'+esc(m.time)+'</span>';
  return '<span class="ft">Τελ.</span>';
}
function matchRow(m){
  const log = state.logs[m.id], fol = !!state.followed[m.id];
  const h = hypeOf(m);
  return '<div class="mrow '+(log?'logged':'')+'" data-action="openMatch" data-id="'+m.id+'">'
    + '<div class="mstat">'+statusCol(m)+'</div>'
    + '<div class="mteams">'+teamLine(m,'home')+teamLine(m,'away')+'</div>'
    + '<div class="mside">'
    + (m.status==='live'?'<span class="hype '+hypeCls(h)+'" title="Παλμός">'+icon('pulse',11)+'<span data-hype="'+m.id+'">'+h+'</span></span>':'')
    + (log?'<span class="rate-pill">★ '+log.rating+'</span>':'')
    + '<button class="starb '+(fol?'on':'')+'" data-action="toggleStar" data-id="'+m.id+'" aria-label="Παρακολούθηση">'+starIcon(fol,19)+'</button>'
    + '</div></div>';
}
/* Collapsible league section: tap the header to open and see the matches. */
function leagueSection(league, matches){
  const liveIn = matches.filter(m=>m.status==='live').length;
  const favIn = matches.some(m=>state.user.favoriteTeams.indexOf(m.homeId)>-1 || state.user.favoriteTeams.indexOf(m.awayId)>-1);
  const key = state.activeSport+'|'+league;
  if(App.ui.openSecs[key]===undefined) App.ui.openSecs[key] = (liveIn>0 || favIn);
  const open = App.ui.openSecs[key];
  return '<div class="mgroup">'
    + '<button class="sec-head '+(open?'open':'')+'" data-action="toggleSection" data-sec="'+esc(key)+'" aria-expanded="'+open+'">'
    + leagueBadge(league,22)
    + '<span class="gname">'+esc(league)+'</span>'
    + '<span class="sec-meta">'
    + (liveIn?'<span class="sec-live"><span class="ld"></span>'+liveIn+' LIVE</span>':'')
    + '<span>'+matches.length+' '+(matches.length===1?'αγώνας':'αγώνες')+'</span>'
    + '</span><span class="chev">'+icon('down',16)+'</span></button>'
    + (open ? matches.map(matchRow).join('') : '')
    + '</div>';
}
/* Match of the Day card: the crowned fixture of the selected day. */
function motdCard(m){
  const st = state.motd;
  const streak = st.streak ? '<span class="motd-streak">Σερί '+st.streak+' 🔥</span>' : '';
  return '<div class="motd"><div class="motd-head">'+icon('trophy',14)+'Το Ματς της Ημέρας'+streak+'</div>'
    + matchRow(m) + '</div>';
}
/* Kickoff Brief - an auto-written daily digest that gives a reason to open the
   app: what's live (and how hot), what's on tonight, when your team plays. */
function briefCard(){
  if(state.activeDay!==0 || state.mineOnly) return '';
  if(state.briefDismissed===dateStrOf(TODAY)) return '';
  const hour = new Date().getHours();
  const greet = hour<12 ? 'Καλημέρα' : hour<18 ? 'Καλό απόγευμα' : 'Καλησπέρα';
  const live = liveMatches();
  const bits = [];
  if(live.length){
    const hot = live.slice().sort((a,b)=>hypeOf(b)-hypeOf(a))[0];
    bits.push('<b>'+live.length+'</b> ματς live τώρα: το '+esc(hot.home.abbr)+'-'+esc(hot.away.abbr)+' έχει Παλμό <b>'+hypeOf(hot)+'</b>');
  }
  const next = MATCHES.filter(m=>m.day===0 && m.status==='ns').sort((a,b)=>a.time.localeCompare(b.time))[0];
  if(next) bits.push('Απόψε <b>'+esc(next.time)+'</b>: '+esc(next.home.name)+' - '+esc(next.away.name)+' ('+esc(next.league)+')');
  const favId = state.user.favoriteTeams.find(id=>MATCHES.some(m=>m.day===1 && (m.homeId===id||m.awayId===id)));
  if(favId) bits.push('Αύριο παίζει η <b>'+esc(TEAMS[favId].name)+'</b>');
  if(!bits.length) return '';
  return '<div class="brief">'
    + '<button class="brief-x" data-action="dismissBrief" aria-label="Κλείσιμο">'+icon('close',15)+'</button>'
    + '<div class="brief-t">'+greet+(state.user.name?', '+esc(state.user.name):'')+'</div>'
    + bits.map(b=>'<div class="brief-line">'+b+'</div>').join('')
    + (live.length?'<button class="fchip on" data-action="nav" data-screen="live" style="margin-top:11px">Δες τα live →</button>':'')
    + '</div>';
}
function dateStrip(){
  return '<div class="datestrip">'+[-2,-1,0,1,2].map(off=>{
    const d = dayDate(off);
    const hasLive = off===0 && liveMatches().length>0;
    const lbl = off===0 ? 'Σήμερα' : GRDAYS[d.getDay()];
    return '<button class="dchip '+(state.activeDay===off?'on':'')+'" data-action="setDay" data-day="'+off+'">'
      + '<span class="dw">'+lbl+'</span><span class="dn">'+d.getDate()+'</span>'
      + (hasLive?'<span class="dot"></span>':'')
      + '</button>';
  }).join('')+'</div>';
}
function renderFeed(){
  const sport = state.activeSport;
  let body='';
  if(state.mineOnly){
    const mine = MATCHES.filter(m=>m.sport===sport && (state.logs[m.id]||state.followed[m.id]));
    body = mine.length
      ? '<div class="mgroup">'+mine.map(matchRow).join('')+'</div>'
      : emptyState('scores','Τίποτα δικό σου ακόμη','Κατέγραψε ή ακολούθησε αγώνες και θα εμφανίζονται εδώ.');
  } else {
    const all = MATCHES.filter(m=>m.sport===sport && m.day===state.activeDay);
    if(!all.length){
      body = emptyState('scores','Κανένας αγώνας','Δεν υπάρχουν αγώνες εδώ. Δοκίμασε άλλη μέρα ή άθλημα.');
    } else {
      const motd = state.activeDay===0 ? motdOf(0,sport) : null;
      if(motd) body += motdCard(motd);
      /* the first screen is the league sections: tap one to open its matches */
      LEAGUE_ORDER[sport].forEach(lg=>{
        const ms = all.filter(m=>m.league===lg);
        if(ms.length) body += leagueSection(lg,ms);
      });
    }
  }
  return '<h1>Αγώνες</h1><p class="sub">'+fmtDay(dayDate(state.activeDay))+' · πάτα μια διοργάνωση για να ανοίξει.</p>'
    + '<div class="seg" role="tablist">'
    + '<button class="'+(sport==='football'?'on':'')+'" data-action="setSport" data-sport="football">⚽ Ποδόσφαιρο</button>'
    + '<button class="'+(sport==='basketball'?'on':'')+'" data-action="setSport" data-sport="basketball">🏀 Μπάσκετ</button>'
    + '</div>'
    + dateStrip()
    + '<div class="row gap8" style="padding:4px"><button class="fchip '+(state.mineOnly?'on':'')+'" data-action="toggleMine">★ Μόνο δικά μου</button></div>'
    + briefCard()
    + '<div class="mt8">'+body+'</div>';
}

function renderLive(){
  const live = liveMatches();
  const done = MATCHES.filter(m=>m.day===0 && m.status==='ft' && (m.events.length));
  let body = live.length ? live.map(liveCard).join('') : emptyState('live','Καμία ζωντανή μετάδοση','Οι αγώνες της ημέρας ολοκληρώθηκαν.');
  if(done.length) body += '<div class="sec-title">Ολοκληρώθηκαν πριν λίγο</div><div class="mgroup">'+done.map(matchRow).join('')+'</div>';
  return '<h1>Live</h1><p class="sub">Ό,τι παίζεται τώρα · οι αγώνες εξελίσσονται μόνοι τους.</p><div class="mt12">'+body+'</div>';
}

  const loggable = MATCHES.filter(m=>m.status!=='ns');
  const groups = [['football','⚽ Ποδόσφαιρο'],['basketball','🏀 Μπάσκετ']];

function eventIcon(t){ return t==='goal'?icon('goal',15):t==='basket'?icon('ball',15):t==='yellow'?'<span style="display:inline-block;width:10px;height:13px;background:var(--gold);border-radius:2px"></span>':icon('clock',15); }

/* --- Live prediction card: pick → the engine itself settles it. --- */
function predCard(m){
  const p = state.predictions[m.id];
  const st = state.predStats;
  const acc = st.total ? Math.round(st.correct/st.total*100) : null;
  const statsLine = st.total
    ? '<div class="tiny muted mt8">Σερί: <b style="color:var(--gold)">'+st.streak+'</b> 🔥 · Ακρίβεια '+acc+'% ('+st.correct+'/'+st.total+')</div>' : '';
  const head = '<div class="pred-q">'+icon('target',17)+'Πρόβλεψη</div>';
  if(p && !p.resolved){
    const pt = (p.pick==='home'||p.pick==='away') ? m[p.pick] : null;
    const pickLbl = p.pick==='none' ? 'Κανένα γκολ' : (pt ? esc(pt.abbr) : '·');
    const until = m.sport==='football' ? ' · μέχρι το '+(p.at+15)+'′' : ' · λήγει με την περίοδο';
    return '<div class="pred-card">'+head
      + '<div class="pred-state wait">'+icon('clock',15)+'Η πρόβλεψή σου: <b>'+pickLbl+'</b>'+until+'</div>'
      + statsLine+'</div>';
  }
  let resolvedLine = '';
  if(p && p.resolved){
    resolvedLine = p.void
      ? '<div class="pred-state">Άκυρη - ισοπαλία στην περίοδο</div>'
      : (p.correct
        ? '<div class="pred-state win">'+icon('check',15)+'Σωστή! Το πέτυχες.</div>'
        : '<div class="pred-state lose">'+icon('close',15)+'Άστοχη αυτή τη φορά.</div>');
  }
  if(m.status!=='live') return (p&&p.resolved) ? '<div class="pred-card">'+head+resolvedLine+statsLine+'</div>' : '';
  const q = m.sport==='football' ? 'Ποιος σκοράρει το επόμενο γκολ;' : 'Ποιος κλείνει μπροστά την περίοδο;';
  const opts = m.sport==='football'
    ? [['home',m.home.abbr],['none','Κανείς σε 15′'],['away',m.away.abbr]]
    : [['home',m.home.abbr],['away',m.away.abbr]];
  return '<div class="pred-card">'+head+resolvedLine
    + '<div class="tiny muted mt8">'+q+'</div>'
    + '<div class="pred-opts">'+opts.map(o=>'<button class="pred-opt" data-action="predict" data-pick="'+o[0]+'">'+esc(o[1])+'</button>').join('')+'</div>'
    + statsLine+'</div>';
}
/* --- Παλμός graph: how the match's temperature evolved. --- */
function hypeSparkCard(m){
  if(!m.hypeLog || m.hypeLog.length<3) return '';
  const now = m.status==='live' ? hypeOf(m) : m.hypeLog[m.hypeLog.length-1];
  return '<div class="bar-card" style="margin-top:12px"><div class="between"><b class="small">'+icon('pulse',14)+' Παλμός αγώνα</b>'
    + '<span class="hype '+hypeCls(now)+'">'+(m.status==='live'?'<span data-hype="'+m.id+'">'+now+'</span>':now)+'</span></div>'
    + '<div class="mt8">'+sparkSVG(m.hypeLog)+'</div>'
    + '<div class="tiny muted">Πάνω από τη γραμμή = αξίζει να το βλέπεις τώρα.</div></div>';
}

/* --- Match chat screen. --- */
function chatCTA(m){
  const st = chatState(m);
  if(st==='locked'){
    const left = kickoffMs(m) - CHAT_OPEN_MS - Date.now();
    return '<button class="chat-cta" data-action="openChat" data-id="'+m.id+'">'+icon('lock',16)
      + 'Chat του αγώνα <span class="lockleft">άνοιγμα σε <span data-chatcount="'+m.id+'">'+fmtCountdown(left)+'</span></span></button>';
  }
  if(st==='archive'){
    return '<button class="chat-cta" data-action="openChat" data-id="'+m.id+'">'+icon('chat',16)

/* ---------- STATS ---------- */
function statBar(labelHtml, val, pct, color){
  return '<div class="bar-line"><div class="bl">'+labelHtml+'</div>'
    + '<div class="sbar"><div class="sfill" data-fill="'+pct+'%" style="width:0;background:'+color+'"></div></div>'
    + '<div class="bv">'+val+'</div></div>';
}
function renderStats(){
  if(!state.settings.showStats){
    return '<h1>Στατιστικά</h1><div class="bar-card center" style="padding:30px"><div class="muted">Τα στατιστικά είναι κρυφά.</div>'
      + '<button class="cta" style="margin-top:16px;max-width:200px" data-action="toggleStats">Εμφάνιση</button></div>';
  }
  const logs = logsArr();
  if(!logs.length){
    return '<h1>Στατιστικά</h1>'+emptyState('stats','Δεν υπάρχουν στατιστικά ακόμη','Κατέγραψε μερικούς αγώνες και θα δεις εδώ τα insights σου.');
  }
  const withM = logs.map(l=>({l,m:matchById(l.matchId)})).filter(x=>x.m);
  const reviews = logs.filter(l=>l.review&&l.review.trim()).length;
  const stadiums = logs.filter(l=>l.location==='stadium').length;
  const rated = ratedLogs();
  const avgR = avgRating(logs);
  const fb = withM.filter(x=>x.m.sport==='football').length, bb = withM.length-fb;
  const loc = { stadium:0, home:0, bar:0 };
  logs.forEach(l=>{ if(l.location && loc[l.location]!=null) loc[l.location]++; });
  const located = loc.stadium+loc.home+loc.bar;
  const dist=[0,0,0,0,0]; logs.forEach(l=>{ if(l.rating) dist[l.rating-1]++; });
  const distMax=Math.max(...dist,1);
  const top = rated.slice().sort((a,b)=>b.rating-a.rating)[0];
  const topM = top?matchById(top.matchId):null;
  const pct=(n,d)=>d?Math.round(n/d*100):0;
  const insights = computeInsights();
  const donutParts=[{v:loc.stadium,c:'var(--ch1)',k:'Γήπεδο'},{v:loc.home,c:'var(--ch2)',k:'Σπίτι'},{v:loc.bar,c:'var(--ch3)',k:'Μπαρ'}];

  return '<h1>Στατιστικά</h1><p class="sub">Η σεζόν σου, διαβασμένη από το Bleachers IQ.</p>'
    + '<div class="stat-hero"><div class="big">'+logs.length+'</div>'
    + '<div class="muted" style="margin-top:4px">αγώνες καταγεγραμμένοι</div></div>'
    + '<div class="mini-grid">'
    + '<div class="mini"><div class="v"><span style="color:var(--gold)">'+starIcon(true,15)+'</span>'+avgR.toFixed(1)+'</div><div class="k">Μ.Ο. βαθμ.</div></div>'
    + '<div class="mini"><div class="v">'+reviews+'</div><div class="k">Κριτικές</div></div>'
    + '<div class="mini"><div class="v">'+stadiums+'</div><div class="k">Στο γήπεδο</div></div>'
    + '</div>'
    + '<div class="sec-title">Bleachers IQ</div>'
    + insights.map(i=>'<div class="iq-card"><div class="iq-ic">'+icon(i.icon,19)+'</div><div><div class="iq-t">'+esc(i.title)+'</div><div class="iq-b">'+i.body+'</div></div></div>').join('')
    + '<div class="sec-title">Προφίλ θεατή</div>'
    + '<div class="bar-card center">'+radarSVG(computeRadar(),250)+'</div>'
    + (located?'<div class="sec-title">Πού τους είδες</div>'
      + '<div class="bar-card"><div class="chart-flex">'+donutSVG(donutParts,located)
      + '<div class="chart-legend">'+donutParts.map(p=>'<div class="cl-row"><span class="swatch" style="background:'+p.c+'"></span><span class="cl-k">'+p.k+'</span><span class="cl-v">'+p.v+'</span></div>').join('')+'</div>'
      + '</div></div>':'')
    + (state.predStats.total?'<div class="bar-card"><b class="small">'+icon('target',13)+' Live προβλέψεις</b>'
      + statBar('<span class="cl-k">Ακρίβεια</span>', Math.round(state.predStats.correct/state.predStats.total*100)+'%', Math.round(state.predStats.correct/state.predStats.total*100), 'var(--ch2)')
      + '<div class="between mt8 small"><span class="muted">Τρέχον σερί</span><b style="color:var(--gold)">'+state.predStats.streak+' 🔥</b></div>'
      + '<div class="between mt8 small"><span class="muted">Καλύτερο σερί</span><b>'+state.predStats.best+'</b></div>'
      + '</div>':'')
    + '<div class="bar-card"><b class="small">Ανά άθλημα</b>'
    + statBar('<span class="swatch" style="background:var(--ch1)"></span>Ποδόσφαιρο', pct(fb,withM.length)+'%', pct(fb,withM.length), 'var(--ch1)')
    + statBar('<span class="swatch" style="background:var(--ch3)"></span>Μπάσκετ', pct(bb,withM.length)+'%', pct(bb,withM.length), 'var(--ch3)')
    + '</div>'
    + '<div class="bar-card"><b class="small">Κατανομή βαθμολογίας</b>'
    + [5,4,3,2,1].map(r=>statBar('<span class="cl-k">'+r+'★</span>', dist[r-1], Math.round(dist[r-1]/distMax*100), 'var(--ch3)')).join('')
    + '</div>'
    + (topM?'<div class="sec-title">Κορυφαία βαθμολογία</div><div class="mgroup"><div class="ghead"><span class="gbadge" style="background:var(--gold);color:#2a1900">'+icon('trophy',13)+'</span><span class="gname">Top αγώνας</span></div>'+matchRow(topM)+'</div>':'');
}

      + '<div class="ob-sub">Το ημερολόγιο των αγώνων που ζεις.<br>Γήπεδο ή καναπές, μετράνε το ίδιο.</div>'
      + '<div class="mt20" style="display:flex;justify-content:center;gap:26px;color:var(--muted);font-size:12px;text-align:center">'
      + '<div>'+icon('live',26)+'<br>Live σκορ</div><div>'+icon('star',26)+'<br>Βαθμολόγησε</div><div>'+icon('stats',26)+'<br>Insights</div>'
      + '</div></div>'
      + '<button class="cta" data-action="obNext">Ξεκίνα</button>';
  } else if(step===1){
    inner = '<h1 class="center" style="font-size:22px;margin-top:30px">Πώς σε λένε;</h1>'
      + '<p class="sub center">Θα φαίνεται στο προφίλ σου.</p>'
      + '<input type="text" data-field="obname" placeholder="π.χ. Κώστας" value="'+esc(App.ui.obName)+'" maxlength="20" style="margin-top:10px">'
      + '<div style="flex:1"></div>'
      + '<button class="cta" data-action="obNext">Συνέχεια</button>'
      + '<button class="cta ghost" data-action="obSkip">Παράλειψη</button>';
  } else {
    const picks = App.ui.obPick;
    inner = '<h1 class="center" style="font-size:22px;margin-top:20px">Οι ομάδες σου</h1>'
      + '<p class="sub center">Οι αγώνες τους θα καρφιτσώνονται πάνω-πάνω.</p>'
      + '<div class="ob-teams">'
      + Object.keys(TEAMS).map(id=>{
          const t = TEAMS[id];
          return '<div class="ob-team '+(picks[id]?'on':'')+'" data-action="obPick" data-id="'+id+'">'
            + crest(t,38)+'<div class="tn">'+esc(t.name)+'</div><div class="sp">'+(t.sport==='football'?'Ποδόσφαιρο':'Μπάσκετ')+'</div></div>';
        }).join('')
      + '</div>'
      + '<button class="cta" data-action="obDone" style="margin-top:20px">Πάμε!</button>';
  }
  return '<div class="ob-wrap"><div class="ob-inner">'+inner+'</div></div>';
}

/* ---------- SHEET / MODALS / EMPTY ---------- */
function renderSheet(){
  const s = App.ui.sheet, m = matchById(s.matchId);
  return '<div class="sheet-wrap" data-action="closeSheet"><div class="sheet" data-stop="1">'
    + '<div class="sheet-grab"></div>'
    + '<div class="sheet-check">'+icon('check',28)+'</div>'
    + '<h3>'+(s.edit?'Ενημερώθηκε!':'Καταγράφηκε!')+'</h3>'
    + '<div class="center tiny muted">Προστέθηκε στο προφίλ σου</div>'
    + '<div class="s-match">'+crest(m.home,28)+'<span>'+esc(m.home.abbr)+' '+m.score.home+'-'+m.score.away+' '+esc(m.away.abbr)+'</span>'+crest(m.away,28)+'</div>'
    + '<div class="s-stars">'+starsGlyph(s.rating)+'</div>'
    + '<div class="modal-actions" style="margin-top:18px">'
    + (s.edit?'':'<button class="btn ghost" data-action="undoLog">Αναίρεση</button>')
    + '<button class="btn ghost" data-action="sheetStats">Στατιστικά</button>'
    + '<button class="btn primary" data-action="closeSheet">Τέλεια</button>'
    + '</div></div></div>';
}
function ratingModal(){
  return '<div class="overlay" data-action="closeModal"><div class="modal" data-stop="1"><div class="modal-ic">'+icon('star',40)+'</div>'
    + '<h3 class="center">Χρειάζεται βαθμολογία</h3><p class="center">Βάλε τουλάχιστον 1 αστέρι πριν την καταγραφή.</p>'
    + '<div class="modal-actions"><button class="btn primary" data-action="closeModal">Εντάξει</button></div></div></div>';
}
function resetModal(){
  return '<div class="overlay" data-action="closeModal"><div class="modal" data-stop="1"><div class="modal-ic" style="color:var(--live)">'+icon('trophy',38)+'</div>'
    + '<h3 class="center">Διαγραφή όλων;</h3><p class="center">Όλες οι καταγραφές σου θα σβηστούν οριστικά.</p>'
    + '<div class="modal-actions"><button class="btn ghost" data-action="closeModal">Άκυρο</button>'
    + '<button class="btn red" data-action="doReset">Διαγραφή</button></div></div></div>';
}
function infoModal(title, body){
  return '<div class="overlay" data-action="closeModal"><div class="modal" data-stop="1">'
    + '<h3 class="center">'+esc(title)+'</h3><p class="center">'+esc(body)+'</p>'
    + '<div class="modal-actions"><button class="btn primary" data-action="closeModal">Εντάξει</button></div></div></div>';
}
function emptyState(ic,title,sub){
  return '<div class="empty"><div class="ec">'+icon(ic,26)+'</div><div style="font-weight:700;color:var(--text)">'+esc(title)+'</div><div class="mt8">'+esc(sub)+'</div></div>';
}
function bottomNav(active){
  const item=(s,ic,label)=>'<button class="nitem '+(active===s?'active':'')+'" data-action="nav" data-screen="'+s+'" aria-label="'+label+'">'+icon(ic,22)+'<span>'+label+'</span></button>';
  return '<nav class="bnav">'+item('feed','scores','Αγώνες')+item('live','live','Live')
    + '<button class="fab" data-action="openPicker" aria-label="Καταγραφή αγώνα">'+icon('plus',26)+'</button>'
    + item('stats','stats','Στατιστικά')+item('profile','profile','Προφίλ')+'</nav>';
}
function screenBody(s){
  if(s==='feed') return renderFeed();
  if(s==='live') return renderLive();
  if(s==='stats') return renderStats();
  if(s==='profile') return renderProfile();
  if(s==='picker') return renderPicker();
  return renderFeed();
}
function render(){
  const ui = App.ui;
  /* replaying entrance animations on every live-engine tick reads as flicker,
     so they run only when the view actually changes */
  const viewKey = ui.screen + '|' + (ui.draft ? ui.draft.matchId + '|' + ui.draft.tab : '') + '|' + (ui.chatMatch||'');
  ui._steady = (viewKey === ui._viewKey);
  ui._viewKey = viewKey;
  const steadyCls = ui._steady ? ' steady' : '';
  let html='';
  if(!state.onboarded){
    html = renderOnboarding();
  } else {
    html = '<div class="shell">';
    if(ui.screen==='matchDetail') html += renderMatchDetail() + bottomNav(ui.screen);
    else if(ui.screen==='matchChat') html += renderMatchChat();   // chat owns the bottom edge
    else html += topBar() + '<div class="screen'+steadyCls+'">' + screenBody(ui.screen) + '</div>' + bottomNav(ui.screen);
    html += '</div>';
    if(ui.search!==null) html += renderSearch();
    if(ui.sheet) html += renderSheet();
    if(ui.modal) html += ui.modal;
  }
  if(ui.toasts.length){
    html += '<div class="toasts">'+ui.toasts.map(t=>
      '<div class="toast '+(t.hot?'hot':'')+'"><span class="ti">'+icon(t.icn,17)+'</span><span>'+t.text+'</span></div>').join('')+'</div>';
  }
  /* keep the chat pinned to the newest message unless the user scrolled up */
  const wasChat = ui.screen==='matchChat' && ui._steady;
  const nearBottom = !wasChat
    || ((window.innerHeight||0) + (window.scrollY||0)) > (((document.body&&document.body.scrollHeight)||0) - 260);
  document.getElementById('app').innerHTML = html;
  requestAnimationFrame(()=>{
    document.querySelectorAll('[data-fill]').forEach(el=>{ el.style.width = el.dataset.fill; });
    const sb = document.getElementById('searchbox');
    if(sb && App.ui.searchFocus){ sb.focus(); sb.setSelectionRange(sb.value.length, sb.value.length); App.ui.searchFocus=false; }
    if(ui.screen==='matchChat'){
      if(nearBottom) window.scrollTo(0, document.body.scrollHeight);
      const cb = document.getElementById('chatbox');
      if(cb && App.ui.chatFocus){ cb.focus(); cb.setSelectionRange(cb.value.length, cb.value.length); }
    }
  });
}

/* =============================================================================
   (5) ACTIONS
============================================================================= */
function setSport(s){ state.activeSport=s; save(); render(); }
function setDay(d){ state.activeDay=+d; state.mineOnly=false; save(); render(); }
function toggleMine(){ state.mineOnly=!state.mineOnly; render(); }
function nav(s){ App.ui.screen=s; window.scrollTo(0,0); render(); }
function toggleStar(id){ if(state.followed[id]) delete state.followed[id]; else state.followed[id]=true; save(); render(); }

function openMatch(id){
  if(App.ui.screen!=='matchDetail') App.ui.backScreen = App.ui.screen;
  App.ui.search = null;
  const log = state.logs[id];
  App.ui.draft = log
    ? { matchId:id, rating:log.rating, review:log.review||'', potm:log.potm||null, location:log.location||null, atmosphere:[...(log.atmosphere||[])], memory:log.memory||'', tab:'summary' }
    : { matchId:id, rating:0, review:'', potm:null, location:null, atmosphere:[], memory:'', tab:'summary' };
  App.ui.screen='matchDetail'; window.scrollTo(0,0); render();
}
function applyLog(d){
  const existing = state.logs[d.matchId];
  state.logs[d.matchId] = {
    matchId:d.matchId, rating:d.rating, review:d.review||'', potm:d.potm||null,
    location:d.location||null, atmosphere:d.atmosphere||[], memory:d.memory||'',
    loggedAt: existing?existing.loggedAt:new Date().toISOString(), updatedAt:new Date().toISOString(),
  };
  if(!existing) bumpMotdStreak(d.matchId);
  save();
  return !existing;
}
function logMatch(){
  const d = App.ui.draft, m = matchById(d.matchId);
  if(m.status==='ns'){ App.ui.modal = infoModal('Δεν έχει αρχίσει','Μπορείς να καταγράψεις έναν αγώνα μόνο αφού αρχίσει.'); render(); return; }
  if(!d.rating){ App.ui.modal = ratingModal(); render(); return; }
  const isNew = applyLog(d);
  App.ui.sheet = { matchId:d.matchId, rating:d.rating, edit:!isNew };
  buzz(30);
  render();
}
function undoLog(){
  const s = App.ui.sheet;
  if(s && !s.edit) { delete state.logs[s.matchId]; save(); }
  App.ui.sheet=null; App.ui.draft=null; nav('feed');
}
function closeSheet(){ const m=matchById(App.ui.sheet.matchId); App.ui.sheet=null; App.ui.draft=null; if(m) state.activeSport=m.sport; save(); nav('feed'); }
function sheetStats(){ App.ui.sheet=null; App.ui.draft=null; nav('stats'); }
function toggleStats(){ state.settings.showStats=!state.settings.showStats; save(); render(); }
function confirmReset(){ App.ui.modal = resetModal(); render(); }
function doReset(){ state = defaultState(); state.onboarded=false; save(); App.ui = { screen:'feed', backScreen:'feed', draft:null, sheet:null, modal:null, search:null, obStep:0, obPick:{}, obName:'', toasts:[], openSecs:{} }; render(); }
function closeModal(){ App.ui.modal=null; render(); }
function openSearch(){ App.ui.search=''; App.ui.searchFocus=true; render(); }
function closeSearch(){ App.ui.search=null; render(); }
function dismissBrief(){ state.briefDismissed = dateStrOf(TODAY); save(); render(); }
function toggleSection(key){
  App.ui.openSecs[key] = !App.ui.openSecs[key];   // default recorded at render time
  render();
}
function openChat(id){
  if(App.ui.screen!=='matchChat') App.ui.backScreen = App.ui.screen==='matchDetail' ? 'matchDetail' : App.ui.screen;
  App.ui.chatMatch = id;
  App.ui.chatInput = '';
  App.ui.chatFocus = false;
  App.ui.screen = 'matchChat';
  render();
}
function react(idx){
  const m = matchById(App.ui.draft && App.ui.draft.matchId);
  const e = REACTIONS[idx];
  if(!m || m.status!=='live' || !e) return;
  if(!state.reactions[m.id]) state.reactions[m.id]=[];
  if(state.reactions[m.id].length>=30) return;
  state.reactions[m.id].push({ c:liveClock(m), e });
  save(); buzz(12); render();
}
function captureMoment(){
  const m = matchById(App.ui.draft && App.ui.draft.matchId);
  if(!m || m.status!=='live') return;
  if(!state.moments[m.id]) state.moments[m.id]=[];
  if(state.moments[m.id].length>=10){ toast('bookmark','Έφτασες τις 10 στιγμές για αυτόν τον αγώνα'); return; }
  const last = m.events.length ? m.events[m.events.length-1] : null;
  state.moments[m.id].push({
    c:liveClock(m), s:m.score.home+'-'+m.score.away,
    t:last ? String(last.min)+' '+last.text : '', ts:Date.now(),
  });
  save(); buzz(25);
  toast('bookmark','Η στιγμή αποθηκεύτηκε: '+liveClock(m)+', '+m.score.home+'-'+m.score.away);
  render();
}

/* onboarding actions */
function obNext(){
  if(App.ui.obStep===1){
    state.user.name = (App.ui.obName||'').trim() || 'Φίλαθλος';
    state.user.handle = '@'+state.user.name.toLowerCase().replace(/\s+/g,'');
  }
  App.ui.obStep++; render();
}
function obSkip(){ state.user.name='Φίλαθλος'; state.user.handle='@bleachers'; App.ui.obStep=2; render(); }
function obPick(id){ if(App.ui.obPick[id]) delete App.ui.obPick[id]; else App.ui.obPick[id]=true; render(); }
function obDone(){
  state.user.favoriteTeams = Object.keys(App.ui.obPick);
  state.onboarded = true;
  if(!state.user.name){ state.user.name='Φίλαθλος'; state.user.handle='@bleachers'; }
  save(); render();
}
function editFavs(){ App.ui.obStep=2; App.ui.obPick={}; state.user.favoriteTeams.forEach(id=>App.ui.obPick[id]=true); state.onboarded=false; render(); }

/* backup */
function exportData(){
  try{
    const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'bleachers-backup.json';
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
  }catch(e){ App.ui.modal = infoModal('Σφάλμα','Το backup απέτυχε: '+e.message); render(); }
}
function importData(){
  const inp = document.createElement('input');
  inp.type='file'; inp.accept='application/json,.json';
  inp.onchange = () => {
    const f = inp.files && inp.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = () => {
      try{
        const data = JSON.parse(r.result);
        if(!data || data.version!==3 || typeof data.logs!=='object') throw new Error('Μη έγκυρο αρχείο backup.');
        Object.assign(state.logs, data.logs);
        Object.assign(state.followed, data.followed||{});
        Object.assign(state.moments, data.moments||{});
        Object.assign(state.predictions, data.predictions||{});
        Object.assign(state.reactions, data.reactions||{});
        Object.assign(state.chat, data.chat||{});
        if(data.predStats && ['correct','total','streak','best'].every(k=>typeof data.predStats[k]==='number')){
          state.predStats = data.predStats;
        }
        if(data.motd && typeof data.motd.streak==='number' && typeof data.motd.best==='number'){
          state.motd = data.motd;
        }
        if(data.user && data.user.name) state.user = data.user;
        save();
        App.ui.modal = infoModal('Έγινε!','Το backup φορτώθηκε: '+Object.keys(data.logs).length+' καταγραφές.');
      }catch(e){ App.ui.modal = infoModal('Σφάλμα', e.message); }
      render();
    };
    r.readAsText(f);
  };
  inp.click();
}

const ACTIONS = {
  nav: el=>nav(el.dataset.screen),
  setSport: el=>setSport(el.dataset.sport),
  setDay: el=>setDay(el.dataset.day),
  toggleMine: ()=>toggleMine(),
  toggleStar: el=>toggleStar(el.dataset.id),
  openPicker: ()=>nav('picker'),
  openMatch: el=>openMatch(el.dataset.id),
  back: ()=>nav(App.ui.backScreen||'feed'),
  setTab: el=>{ App.ui.draft.tab=el.dataset.tab; render(); },
  setRating: el=>{ App.ui.draft.rating=+el.dataset.val; buzz(15); render(); },
  setPotm: el=>{ const m=matchById(App.ui.draft.matchId); App.ui.draft.potm=m.players[+el.dataset.idx]; render(); },
  setLocation: el=>{ App.ui.draft.location=el.dataset.loc; render(); },
  toggleAtmo: el=>{ const a=App.ui.draft.atmosphere,k=el.dataset.atmo,i=a.indexOf(k); if(i>=0)a.splice(i,1); else a.push(k); render(); },
  logMatch: ()=>logMatch(),
  undoLog: ()=>undoLog(),
  closeSheet: ()=>closeSheet(),
  sheetStats: ()=>sheetStats(),
  toggleStats: ()=>toggleStats(),
  confirmReset: ()=>confirmReset(),
  doReset: ()=>doReset(),
  closeModal: ()=>closeModal(),
  openSearch: ()=>openSearch(),
  closeSearch: ()=>closeSearch(),
  obNext: ()=>obNext(),
  obSkip: ()=>obSkip(),
  obPick: el=>obPick(el.dataset.id),
  obDone: ()=>obDone(),
  editFavs: ()=>editFavs(),
  exportData: ()=>exportData(),
  importData: ()=>importData(),
  predict: el=>placePrediction(App.ui.draft && App.ui.draft.matchId, el.dataset.pick),
  captureMoment: ()=>captureMoment(),
  dismissBrief: ()=>dismissBrief(),
  toggleSection: el=>toggleSection(el.dataset.sec),
  react: el=>react(+el.dataset.e),
  openChat: el=>openChat(el.dataset.id),
  sendChat: ()=>sendChat(),
};

/* =============================================================================
   (6) NAVIGATION & INIT
============================================================================= */
document.addEventListener('click', e=>{
  const stop = e.target.closest('[data-stop]');
  const t = e.target.closest('[data-action]');
  if(!t) return;
  const act = t.getAttribute('data-action');
  if((act==='closeSheet'||act==='closeModal') && stop && t.contains(stop) && stop!==t) return;
  const fn = ACTIONS[act];
  if(fn){ e.preventDefault(); fn(t); }
});
/* Draft/search/name fields sync without re-render (keeps the caret). */
document.addEventListener('input', e=>{
  const f = e.target.getAttribute && e.target.getAttribute('data-field');
  if(!f) return;
  if(f==='search'){
    App.ui.search = e.target.value;
    /* live results: re-render list only, keep input focus */
    App.ui.searchFocus = true; render();
  }
  else if(f==='chat'){ App.ui.chatInput = e.target.value; App.ui.chatFocus = true; }
  else if(f==='obname') App.ui.obName = e.target.value;
  else if(App.ui.draft) App.ui.draft[f] = e.target.value;
});
/* Enter sends a chat message. */
document.addEventListener('keydown', e=>{
  if(e.key==='Enter' && e.target && e.target.id==='chatbox'){ e.preventDefault(); sendChat(); }
});
/* Swipe between main screens. */
(function(){
  const order = ['feed','live','stats','profile'];
  let x0=null, y0=null;
  document.addEventListener('touchstart', e=>{ x0=e.touches[0].clientX; y0=e.touches[0].clientY; }, {passive:true});
  document.addEventListener('touchend', e=>{
    if(x0===null) return;
    const dx = e.changedTouches[0].clientX-x0, dy = e.changedTouches[0].clientY-y0;
    x0=null; y0=null;
    if(Math.abs(dx)<64 || Math.abs(dy)>Math.abs(dx)*0.7) return;
    if(!state.onboarded || App.ui.modal || App.ui.sheet || App.ui.search!==null || App.ui.screen==='matchDetail' || App.ui.screen==='picker') return;
    const i = order.indexOf(App.ui.screen);
    if(i<0) return;
    const next = dx<0 ? Math.min(order.length-1, i+1) : Math.max(0, i-1);
    if(next!==i) nav(order[next]);
  }, {passive:true});
})();

render();
/* Preload crest art after the page has painted so a slow CDN never blocks first render. */
if(document.readyState === 'complete') preloadLogos();
else window.addEventListener('load', preloadLogos, { once:true });
startSim();
</script>

<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0d0f13">
<title>Bleachers</title>
<style>
/* ============================ THEME TOKENS ============================ */
:root{
  --bg:#0d0f13;
  --surface:#161a20;
  --surface2:#1d222b;
  --elev:#222834;
  --border:#272d38;
  --border-soft:#1f242d;
  --text:#eef1f5;
  --muted:#8a93a3;
  --faint:#5b6472;
  --accent:#5DCAA5;
  --accent-dim:#0f3a2e;
  --gold:#F2B14C;
  --live:#F0413F;
  --radius:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif;
  line-height:1.45;-webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
.shell{max-width:440px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:88px;background:var(--bg)}
button{font-family:inherit;cursor:pointer}
.icon{display:block}
.crest-sprite{position:absolute;width:0;height:0;overflow:hidden}

/* utilities */
.muted{color:var(--muted)} .tiny{font-size:11px} .small{font-size:13px}
.center{text-align:center} .nums{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center} .between{display:flex;align-items:center;justify-content:space-between}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}
.sec-title{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700;margin:20px 4px 10px}

/* ============================ TOP BAR ============================ */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px 10px;background:linear-gradient(180deg,var(--bg) 72%,rgba(13,15,19,0))}
.brand{font-weight:800;font-size:19px;letter-spacing:.14em;text-transform:uppercase}
.brand b{color:var(--accent);font-weight:800}
.tb-right{display:flex;align-items:center;gap:10px}
.livecount{display:flex;align-items:center;gap:6px;background:rgba(240,65,63,.12);border:1px solid rgba(240,65,63,.4);
  color:var(--live);font-size:12px;font-weight:800;padding:5px 10px;border-radius:999px;letter-spacing:.04em}
.tb-av{width:32px;height:32px;border-radius:50%;background:linear-gradient(140deg,var(--accent),#2f7d64);
  color:#06241a;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}

/* ============================ SCREEN TRANSITIONS ============================ */
.screen{padding:0 14px;animation:rise .28s cubic-bezier(.22,1,.36,1) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.screen h1{font-size:23px;margin:4px 4px 2px;letter-spacing:-.01em}
.screen .sub{color:var(--muted);font-size:13px;margin:0 4px 8px}

/* ============================ SEGMENTED / CHIPS ============================ */
.seg{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:4px;margin:8px 4px}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);padding:10px;border-radius:9px;font-weight:700;font-size:14px;transition:.2s}
.seg button.on{background:var(--elev);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.35)}
.chips-row{display:flex;gap:8px;padding:4px;overflow-x:auto;scrollbar-width:none}
.chips-row::-webkit-scrollbar{display:none}
.fchip{border:1px solid var(--border);background:var(--surface);color:var(--muted);padding:7px 13px;border-radius:999px;
  font-size:13px;font-weight:600;white-space:nowrap;transition:.15s}
.fchip.on{background:var(--accent);border-color:var(--accent);color:#06241a}

/* ============================ CRESTS ============================ */
.crest{position:relative;display:inline-flex;flex-shrink:0;vertical-align:middle}
.crest-fb{position:absolute;inset:0;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-weight:800;letter-spacing:.01em;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.crest-img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))}

/* ============================ MATCH GROUPS / ROWS (Flashscore) ============================ */
.mgroup{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:12px}
.ghead{display:flex;align-items:center;gap:9px;padding:11px 13px;background:var(--surface2);border-bottom:1px solid var(--border)}
.gbadge{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#fff;flex-shrink:0}
.gname{font-weight:700;font-size:13px}
.gcountry{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-left:auto}
.ghead.live{background:linear-gradient(90deg,rgba(240,65,63,.16),transparent)}
.ghead.live .gname{color:var(--live)}
.ghead.fav .gname{color:var(--gold)}

.mrow{display:flex;align-items:center;gap:10px;padding:9px 12px;border-top:1px solid var(--border-soft);transition:background .15s}
.mrow:first-child{border-top:0}
.mrow:active{background:var(--surface2)}
.mrow.logged{box-shadow:inset 3px 0 0 var(--accent)}
.mstat{width:34px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.25}
.mstat .min{color:var(--live);font-weight:800;font-size:12px;display:flex;align-items:center;gap:3px}
.mstat .ld{width:6px;height:6px;border-radius:50%;background:var(--live);animation:pulse 1.1s infinite}
.mstat .ft{font-size:10.5px;font-weight:700;color:var(--faint)}
.mstat .dd{font-size:10px;color:var(--faint)}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
.mteams{flex:1;min-width:0}
.tl{display:flex;align-items:center;gap:9px;padding:2.5px 0}
.tn{flex:1;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#d6dbe3}
.tsc{font-weight:800;font-variant-numeric:tabular-nums;font-size:15px;min-width:16px;text-align:right;color:#d6dbe3}
.tl.win .tn,.tl.win .tsc{color:#fff}
.tl.lose .tn,.tl.lose .tsc{color:var(--faint)}
.mside{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0}
.rate-pill{background:rgba(242,177,76,.15);color:var(--gold);font-weight:800;font-size:11px;padding:2px 7px;border-radius:999px}
.starb{background:none;border:0;color:#3c434f;padding:2px;line-height:0;transition:transform .15s,color .15s}
.starb.on{color:var(--gold)} .starb:active{transform:scale(1.3)}

/* ============================ LIVE TAB CARDS ============================ */
.livecard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:12px;
  position:relative;overflow:hidden}
.livecard::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--live)}
.lc-top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.lc-badge{display:flex;align-items:center;gap:5px;background:var(--live);color:#fff;font-weight:800;font-size:11px;padding:3px 9px;border-radius:6px;letter-spacing:.05em}
.lc-badge .ld{width:6px;height:6px;border-radius:50%;background:#fff;animation:pulse 1.1s infinite}
.lc-clock{font-weight:800;color:var(--live)}
.lc-league{margin-left:auto;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.lc-team{display:flex;align-items:center;gap:12px;padding:5px 0}
.lc-team .tn{font-size:16px;font-weight:700;color:#fff}
.lc-team .tsc{font-size:22px;font-weight:800}

/* ============================ MATCH DETAIL ============================ */
.dhead{position:sticky;top:0;z-index:30;background:var(--bg);padding:12px 14px 6px;display:flex;align-items:center;gap:12px}
.iconbtn{width:38px;height:38px;border-radius:11px;border:1px solid var(--border);background:var(--surface);color:var(--text);
  display:flex;align-items:center;justify-content:center}
.dhead .dt{font-weight:700;font-size:15px}
.hero{margin:4px 14px 0;background:radial-gradient(120% 90% at 50% 0,rgba(93,202,165,.08),transparent 60%),var(--surface);
  border:1px solid var(--border);border-radius:18px;padding:18px 14px}
.hero-top{text-align:center;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:14px}
.hero-main{display:flex;align-items:flex-start;justify-content:space-between;gap:6px}
.hero-team{width:108px;display:flex;flex-direction:column;align-items:center;gap:9px;text-align:center}
.hero-team .tn{font-size:13px;font-weight:700;line-height:1.2}
.hero-mid{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:96px}
.hero-score{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.hero-status{margin-top:4px;font-size:12px;font-weight:700;color:var(--muted)}
.hero-status.live{color:var(--live);display:flex;align-items:center;gap:5px}
.hero-status .ld{width:7px;height:7px;border-radius:50%;background:var(--live);animation:pulse 1.1s infinite}
.hero-meta{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:14px;color:var(--muted);font-size:12px}
.ctx-chips{display:flex;gap:7px;justify-content:center;margin-top:12px}
.ctx{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;border:1px solid var(--border)}
.ctx.derby{color:var(--live);border-color:rgba(240,65,63,.4)}
.ctx.euro{color:var(--accent);border-color:rgba(93,202,165,.4)}

.tabs{display:flex;gap:6px;margin:14px 14px 0;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:4px}
.tabs button{flex:1;border:0;background:transparent;color:var(--muted);padding:10px;border-radius:9px;font-weight:700;font-size:13.5px;transition:.2s}
.tabs button.on{background:var(--elev);color:var(--text)}
.dbody{padding:8px 14px 0;animation:rise .22s ease both}

.info-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-top:12px}
.info-row{display:flex;align-items:center;justify-content:space-between;padding:13px;border-top:1px solid var(--border-soft);font-size:14px}
.info-row:first-child{border-top:0}
.info-row .k{color:var(--muted)} .info-row .v{font-weight:600}
.players-row{display:flex;align-items:center;gap:10px;padding:11px 13px;border-top:1px solid var(--border-soft)}
.pdot{width:8px;height:8px;border-radius:50%;background:var(--accent)}

.label{font-weight:700;font-size:15px;margin:20px 2px 10px}
.stars{display:flex;gap:10px;justify-content:center;margin:8px 0}
.stars span{font-size:36px;color:#363c47;transition:transform .12s,color .15s}
.stars span.on{color:var(--gold)}
.stars span:active{transform:scale(1.25)}
.rate-label{text-align:center;font-weight:700;color:var(--gold);min-height:20px;font-size:15px}
textarea{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:12px;color:var(--text);
  padding:13px;font-family:inherit;font-size:14px;resize:vertical;min-height:78px}
textarea:focus{outline:none;border-color:var(--accent)}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:9px 13px;border-radius:999px;
  font-size:13px;font-weight:600;transition:.15s}
.pill.on{background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}

.loc-opts{display:flex;flex-direction:column;gap:10px}
.loc-opt{display:flex;align-items:center;gap:13px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;transition:.15s}
.loc-opt.on{border-color:var(--accent);background:var(--accent-dim)}
.loc-opt .lic{width:40px;height:40px;border-radius:11px;background:var(--surface2);display:flex;align-items:center;justify-content:center;color:var(--accent)}
.loc-opt.on .lic{background:rgba(93,202,165,.18)}
.loc-opt .nm{font-weight:700} .loc-opt .ck{margin-left:auto;color:var(--accent);opacity:0;transition:.15s}
.loc-opt.on .ck{opacity:1}
.venue-note{margin-top:14px;background:var(--surface);border:1px dashed var(--accent);border-radius:12px;padding:12px;
  color:var(--accent);font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;animation:rise .25s ease both}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.ptile{aspect-ratio:1;background:var(--surface2);border:1px dashed var(--border);border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--faint)}
.cta{width:100%;border:0;background:var(--accent);color:#06241a;font-weight:800;font-size:16px;padding:15px;border-radius:13px;margin:22px 0 6px;transition:transform .1s}
.cta:active{transform:scale(.985)} .cta.edit{background:var(--gold);color:#2a1900} .cta.ghost{background:var(--surface);border:1px solid var(--border);color:var(--text)}

/* logged-summary banner inside summary tab */
.your-log{background:linear-gradient(120deg,var(--accent-dim),var(--surface));border:1px solid var(--accent);border-radius:14px;padding:14px;margin-top:12px}
.your-log .yl-stars{color:var(--gold);font-size:16px;letter-spacing:1px}

/* ============================ STATS ============================ */
.stat-hero{background:radial-gradient(130% 100% at 0 0,rgba(93,202,165,.12),transparent 55%),var(--surface);
  border:1px solid var(--border);border-radius:18px;padding:18px}
.stat-hero .big{font-size:46px;font-weight:800;line-height:1}
.mini-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.mini{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:13px;text-align:center}
.mini .v{font-size:22px;font-weight:800} .mini .k{font-size:11px;color:var(--muted);margin-top:2px}
.bar-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:15px;margin-top:12px}
.bar-line{display:flex;align-items:center;gap:10px;margin-top:11px}
.bar-line:first-of-type{margin-top:6px}
.bar-line .bl{width:74px;font-size:13px;font-weight:600;flex-shrink:0;display:flex;align-items:center;gap:7px}
.bar-line .bv{width:34px;text-align:right;font-size:12px;font-weight:700;color:var(--muted)}
.sbar{flex:1;height:9px;background:var(--surface2);border-radius:999px;overflow:hidden}
.sfill{height:100%;border-radius:999px;transition:width .9s cubic-bezier(.22,1,.36,1)}

/* ============================ PROFILE ============================ */
.prof-card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:18px}
.prof-head{display:flex;align-items:center;gap:14px}
.avatar{width:62px;height:62px;border-radius:50%;background:linear-gradient(140deg,var(--accent),#2f7d64);
  display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;color:#06241a;box-shadow:0 0 0 4px rgba(93,202,165,.12)}
.prof-name{font-size:20px;font-weight:800}
.counters{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.counter{text-align:center} .counter .v{font-size:20px;font-weight:800} .counter .k{font-size:11px;color:var(--muted)}
.team-pill{display:inline-flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--border);
  border-radius:999px;padding:7px 13px 7px 7px;margin:0 8px 8px 0;font-size:13px;font-weight:600}
.team-pill .sp{font-size:11px;color:var(--muted)}
.set-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:4px 16px}
.set-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-top:1px solid var(--border-soft)}
.set-row:first-child{border-top:0}
.tgl{width:46px;height:27px;border-radius:999px;background:var(--surface2);border:1px solid var(--border);position:relative;transition:.2s}
.tgl.on{background:var(--accent)}
.tgl::after{content:"";position:absolute;top:2px;left:2px;width:21px;height:21px;border-radius:50%;background:#fff;transition:transform .2s}
.tgl.on::after{transform:translateX(19px)}
.danger{color:var(--live);font-weight:700}
.mini-log{display:flex;align-items:center;gap:11px;padding:11px 0;border-top:1px solid var(--border-soft)}
.mini-log:first-child{border-top:0}
.mini-log .ml-rt{margin-left:auto;color:var(--gold);font-size:13px;white-space:nowrap;font-weight:700}

/* ============================ BOTTOM NAV ============================ */
.bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;height:74px;
  background:rgba(18,21,27,.94);backdrop-filter:blur(12px);border-top:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-around;z-index:50;padding-bottom:env(safe-area-inset-bottom,0)}
.nitem{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--faint);font-size:10.5px;font-weight:600;background:none;border:0;transition:color .15s}
.nitem.active{color:var(--accent)}
.fab{width:56px;height:56px;border-radius:18px;background:var(--accent);color:#06241a;border:0;margin-top:-22px;
  box-shadow:0 10px 24px rgba(93,202,165,.38);display:flex;align-items:center;justify-content:center;transition:transform .12s}
.fab:active{transform:scale(.92) rotate(90deg)}

/* ============================ OVERLAYS / SHEET / MODAL ============================ */
.overlay{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.66);padding:22px;animation:fade .2s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:22px;max-width:360px;width:100%;animation:pop .24s ease both}
.modal h3{margin:0 0 8px;font-size:18px} .modal p{color:var(--muted);font-size:14px;margin:0 0 18px}
.modal-actions{display:flex;gap:10px} .btn{flex:1;padding:13px;border-radius:11px;border:0;font-weight:700;font-size:15px}
.btn.ghost{background:var(--surface2);color:var(--text);border:1px solid var(--border)} .btn.primary{background:var(--accent);color:#06241a} .btn.red{background:var(--live);color:#fff}
.modal-ic{display:flex;justify-content:center;margin-bottom:6px;color:var(--gold)}
@keyframes pop{0%{transform:scale(.85);opacity:0}60%{transform:scale(1.02)}100%{transform:scale(1);opacity:1}}

.sheet-wrap{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55);animation:fade .2s ease both}
.sheet{background:var(--surface);border:1px solid var(--border);border-bottom:0;border-radius:22px 22px 0 0;
  width:100%;max-width:440px;padding:10px 20px 26px;animation:slideup .34s cubic-bezier(.22,1,.36,1) both}
@keyframes slideup{from{transform:translateY(100%)}to{transform:none}}
.sheet-grab{width:40px;height:4px;border-radius:999px;background:var(--border);margin:6px auto 16px}
.sheet-check{width:58px;height:58px;border-radius:50%;background:var(--accent-dim);border:2px solid var(--accent);
  display:flex;align-items:center;justify-content:center;margin:0 auto 12px;color:var(--accent);animation:pop .4s ease both}
.sheet h3{text-align:center;margin:0 0 4px;font-size:19px}
.sheet .s-match{display:flex;align-items:center;justify-content:center;gap:10px;margin:14px 0;font-weight:700}
.sheet .s-stars{text-align:center;color:var(--gold);font-size:22px;letter-spacing:2px;margin-bottom:6px}

.empty{text-align:center;color:var(--muted);padding:40px 18px;font-size:14px}
.empty .ec{width:54px;height:54px;border-radius:16px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;color:var(--faint)}
</style>
</head>
<body>

<!-- Static fallback crest monograms are drawn in JS; this hidden SVG sprite hosts shared icon defs only. -->
<svg class="crest-sprite" aria-hidden="true"></svg>

<div id="app"></div>

<script>
/* =============================================================================
   BLEACHERS  —  a Flashscore-style match tracker with a Letterboxd twist
   -----------------------------------------------------------------------------
   Browse football & basketball matches like a live-scores app, then LOG the ones
   you watched (stadium OR couch): rate them, review them, pick a Player of the
   Match and record where you watched. A personal Stats dashboard turns those
   logs into Spotify-Wrapped-style insights. Single file, vanilla JS.

   • Team logos load from public CDNs (api-sports / TheSportsDB) with an instant
     coloured-monogram fallback, so the UI never looks broken offline.
   • All user data persists in localStorage under one versioned key.

   NOTE: the previous Duolingo-style gamification (XP, levels, streaks, badges,
   challenges, leaderboard, celebration) was removed per request. The logs still
   capture everything needed to reintroduce it; the full engine lives in git
   history (commit e78ba44) if we switch it back on later.

   Code map:  (1) DATA & STATE   (2) HELPERS   (3) RENDER / SCREENS
              (4) ACTIONS        (5) NAVIGATION & INIT
============================================================================= */

/* =============================================================================
   (1) DATA & STATE
============================================================================= */
const STORAGE_KEY = 'bleachers_v2';

const SDB = code => 'https://r2.thesportsdb.com/images/media/team/badge/' + code + '.png';

/* Clean default state. */
function defaultState(){
  return {
    version:2,
    user:{ name:'Κώστας', handle:'@kostas', city:'Αθήνα',
      favoriteTeams:[
        { name:'Panathinaikos',     sport:'basketball', color:'#0E7A3B', logo:SDB('7cdjwz1767366987') },
        { name:'Borussia Dortmund', sport:'football',   color:'#FDE100', logo:FB(165) },
      ] },
    activeSport:'football',
    feedFilter:'all',
    logs:{},          // matchId -> log
    followed:{},      // matchId -> true (Flashscore star)
    settings:{ showStats:true },
  };
}

/* Persistence (never throws even if storage is blocked). */
function load(){
  try{ const r = localStorage.getItem(STORAGE_KEY); return r ? Object.assign(defaultState(), JSON.parse(r)) : defaultState(); }
  catch(e){ return defaultState(); }
}
function save(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){} }

let state = load();
const App = { ui:{ screen:'feed', backScreen:'feed', draft:null, sheet:null, modal:null } };

/* =============================================================================
   (2) HELPERS
============================================================================= */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function matchById(id){ return MATCHES.find(m=>m.id===id); }
function fmtDate(s){ const [y,m,d]=s.split('-').map(Number); return d+' '+GRMON[m-1]; }
function shortDate(s){ const [y,m,d]=s.split('-').map(Number); return d+'/'+m; }
function textColorFor(hex){ const c=hex.replace('#',''); const r=parseInt(c.substr(0,2),16),g=parseInt(c.substr(2,2),16),b=parseInt(c.substr(4,2),16); return (0.299*r+0.587*g+0.114*b)>150?'#11110f':'#fff'; }
function logsArr(){ return Object.values(state.logs); }

/* Inline icon set (stroke = currentColor). */

  edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',

function icon(name, size, cls){
  const s = size||22;
  return '<svg class="icon '+(cls||'')+'" viewBox="0 0 24 24" width="'+s+'" height="'+s+'" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+ICONS[name]+'</svg>';
}
function starIcon(filled, size){
  const s=size||20;
  return '<svg viewBox="0 0 24 24" width="'+s+'" height="'+s+'" fill="'+(filled?'currentColor':'none')+'" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">'+ICONS.star+'</svg>';
}

/* Team crest: real CDN logo over an instant coloured-monogram fallback. */
function crest(team, size){
  const s = size||40;
  const fb = '<span class="crest-fb" style="background:'+team.color+';color:'+textColorFor(team.color)+';font-size:'+Math.round(s*0.34)+'px">'+esc(team.abbr)+'</span>';
  const img = team.logo ? '<img class="crest-img" src="'+team.logo+'" alt="" loading="lazy" onerror="this.style.display=\'none\'">' : '';
  return '<span class="crest" style="width:'+s+'px;height:'+s+'px">'+fb+img+'</span>';
}
function starsGlyph(n){ let o=''; for(let i=1;i<=5;i++) o += (i<=n?'★':'☆'); return o; }

============================================================================= */
function topBar(){

    + '<div class="tb-av" data-action="nav" data-screen="profile">'+esc(state.user.name[0])+'</div>'
    + '</div></div>';
}

/* ---------- FEED ---------- */
function teamLine(m, side){
  const team = m[side], score = m.score[side];
  let cls = '';
  if(m.status==='ft'){
    const mine = m.score[side], other = m.score[side==='home'?'away':'home'];
    cls = mine>other ? 'win' : (mine<other ? 'lose' : '');
  }
  return '<div class="tl '+cls+'">'+crest(team,26)+'<span class="tn">'+esc(team.name)+'</span><span class="tsc">'+score+'</span></div>';
}
function statusCol(m){
  if(m.status==='live') return '<span class="min"><span class="ld"></span>'+esc(m.clock)+'</span>';
  return '<span class="ft">Τελ.</span><span class="dd">'+shortDate(m.date)+'</span>';
}
function matchRow(m){
  const log = state.logs[m.id], fol = !!state.followed[m.id];
  return '<div class="mrow '+(log?'logged':'')+'" data-action="openMatch" data-id="'+m.id+'">'
    + '<div class="mstat">'+statusCol(m)+'</div>'
    + '<div class="mteams">'+teamLine(m,'home')+teamLine(m,'away')+'</div>'
    + '<div class="mside">'
    + (log?'<span class="rate-pill">★ '+log.rating+'</span>':'')
    + '<button class="starb '+(fol?'on':'')+'" data-action="toggleStar" data-id="'+m.id+'">'+starIcon(fol,19)+'</button>'
    + '</div></div>';
}
function leagueGroup(league, country, matches, variant){
  let head;
  if(variant==='live') head = '<div class="ghead live"><span class="gbadge" style="background:var(--live)">'+icon('live',13)+'</span><span class="gname">ΖΩΝΤΑΝΑ ΤΩΡΑ</span></div>';
  else if(variant==='fav') head = '<div class="ghead fav"><span class="gbadge" style="background:var(--gold);color:#2a1900">'+starIcon(true,13)+'</span><span class="gname">ΤΑ ΑΓΑΠΗΜΕΝΑ ΣΟΥ</span></div>';
  else {
    const color = LEAGUE_COLOR[league] || 'var(--faint)';
    const initials = league.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
    const region = LEAGUE_REGION[league] || country || '';
    head = '<div class="ghead"><span class="gbadge" style="background:'+color+'">'+esc(initials)+'</span><span class="gname">'+esc(league)+'</span><span class="gcountry">'+esc(region)+'</span></div>';
  }
  return '<div class="mgroup">'+head+matches.map(matchRow).join('')+'</div>';
}
function renderFeed(){
  const sport = state.activeSport, filter = state.feedFilter;
  let all = MATCHES.filter(m=>m.sport===sport);
  let body = '';

  if(filter==='logged') all = all.filter(m=>state.logs[m.id]);

  if(all.length===0){
    body = emptyState('scores','Κανένας αγώνας εδώ', filter==='logged'?'Δεν έχεις καταγράψει αγώνες σε αυτό το άθλημα.':'Δοκίμασε άλλο φίλτρο.');
  } else if(filter==='all'){
    const fav = all.filter(m=>state.followed[m.id]);
    const live = all.filter(m=>m.status==='live' && !state.followed[m.id]);
    const rest = all.filter(m=>m.status!=='live' && !state.followed[m.id]);
    if(fav.length) body += leagueGroup(null,null,fav,'fav');
    if(live.length) body += leagueGroup(null,null,live,'live');
    LEAGUE_ORDER[sport].forEach(lg=>{
      const ms = rest.filter(m=>m.league===lg);
      if(ms.length) body += leagueGroup(lg, ms[0].country, ms);
    });
  } else { // logged
    LEAGUE_ORDER[sport].forEach(lg=>{
      const ms = all.filter(m=>m.league===lg);
      if(ms.length) body += leagueGroup(lg, ms[0].country, ms);
    });
  }

  const chip = (id,label)=>'<button class="fchip '+(filter===id?'on':'')+'" data-action="setFilter" data-filter="'+id+'">'+label+'</button>';
  return '<h1>Αγώνες</h1><p class="sub">Δες τα ματς και κατέγραψε όσα παρακολούθησες.</p>'
    + '<div class="seg">'
    + '<button class="'+(sport==='football'?'on':'')+'" data-action="setSport" data-sport="football">⚽ Ποδόσφαιρο</button>'
    + '<button class="'+(sport==='basketball'?'on':'')+'" data-action="setSport" data-sport="basketball">🏀 Μπάσκετ</button>'
    + '</div>'
    + '<div class="chips-row">'+chip('all','Όλα')+chip('logged','Καταγεγραμμένα')+'</div>'
    + '<div class="mt12">'+body+'</div>';
}

/* ---------- LIVE TAB ---------- */
function liveCard(m){
  const log = state.logs[m.id];
  return '<div class="livecard" data-action="openMatch" data-id="'+m.id+'">'
    + '<div class="lc-top"><span class="lc-badge"><span class="ld"></span>LIVE</span>'
    + '<span class="lc-clock">'+esc(m.clock)+'</span>'
    + '<span class="lc-league">'+esc(m.league)+'</span></div>'
    + '<div class="lc-team"><div class="tl" style="flex:1">'+crest(m.home,40)+'<span class="tn">'+esc(m.home.name)+'</span></div><span class="tsc">'+m.score.home+'</span></div>'
    + '<div class="lc-team"><div class="tl" style="flex:1">'+crest(m.away,40)+'<span class="tn">'+esc(m.away.name)+'</span></div><span class="tsc">'+m.score.away+'</span></div>'
    + (log?'<div class="tiny" style="margin-top:8px;color:var(--gold)">★ Το έχεις βαθμολογήσει με '+log.rating+'/5</div>':'')
    + '</div>';
}
function renderLive(){
  const live = MATCHES.filter(m=>m.status==='live');
  let body = live.length ? live.map(liveCard).join('') : emptyState('live','Καμία ζωντανή μετάδοση','Δεν παίζεται κάποιος αγώνας αυτή τη στιγμή.');
  return '<h1>Live</h1><p class="sub">Ό,τι παίζεται τώρα, σε ένα μέρος.</p><div class="mt12">'+body+'</div>';
}

/* ---------- LOG PICKER (FAB) ---------- */
function renderPicker(){

/* ---------- MATCH DETAIL ---------- */
function renderMatchDetail(){
  const d = App.ui.draft, m = matchById(d.matchId);
  const tabs = [['summary','Σύνοψη'],['rate','Βαθμολογία'],['exp','Εμπειρία']];
  let body;
  if(d.tab==='rate') body = tabRate(d,m);
  else if(d.tab==='exp') body = tabExperience(d,m);
  else body = tabSummary(d,m);

  const statusHtml = m.status==='live'
    ? '<div class="hero-status live"><span class="ld"></span>LIVE · '+esc(m.clock)+'</div>'
    : '<div class="hero-status">Τελικό</div>';

  return '<div class="dhead"><button class="iconbtn" data-action="back">'+icon('back',20)+'</button>'
    + '<div><div class="dt">'+esc(m.home.abbr)+' '+m.score.home+'–'+m.score.away+' '+esc(m.away.abbr)+'</div>'
    + '<div class="tiny muted">'+esc(m.league)+' · '+fmtDate(m.date)+'</div></div></div>'
    + '<div class="hero">'
    + '<div class="hero-top">'+esc(m.league)+' · '+esc(m.country)+'</div>'
    + '<div class="hero-main">'
    + '<div class="hero-team">'+crest(m.home,56)+'<span class="tn">'+esc(m.home.name)+'</span></div>'
    + '<div class="hero-mid"><div class="hero-score">'+m.score.home+'–'+m.score.away+'</div>'+statusHtml+'</div>'
    + '<div class="hero-team">'+crest(m.away,56)+'<span class="tn">'+esc(m.away.name)+'</span></div>'
    + '</div>'
    + '<div class="hero-meta">'+icon('pin',14)+'<span>'+esc(m.venue)+' · '+fmtDate(m.date)+'</span></div>'
    + ((m.derby||m.euro)?'<div class="ctx-chips">'+(m.derby?'<span class="ctx derby">Ντέρμπι</span>':'')+(m.euro?'<span class="ctx euro">Euro Night</span>':'')+'</div>':'')
    + '</div>'
    + '<div class="tabs">'+tabs.map(t=>'<button class="'+(d.tab===t[0]?'on':'')+'" data-action="setTab" data-tab="'+t[0]+'">'+t[1]+'</button>').join('')+'</div>'
    + '<div class="dbody">'+body+'</div>';
}
function tabSummary(d,m){
  const log = state.logs[m.id];
  let yourLog = '';
  if(log){
    yourLog = '<div class="your-log"><div class="between"><b>Η καταγραφή σου</b><span class="yl-stars">'+starsGlyph(log.rating)+'</span></div>'
      + (log.review&&log.review.trim()?'<div class="small mt8" style="font-style:italic;color:#d6dbe3">“'+esc(log.review.trim())+'”</div>':'')
      + (log.location?'<div class="tiny muted mt8">'+icon('pin',12,'')+' '+esc(LOCATIONS[log.location].label)+(log.potm?' · MVP: '+esc(log.potm):'')+'</div>':'')
      + '</div>';
  }
  const info = [['Διοργάνωση',m.league],['Χώρα',m.country],['Γήπεδο',m.venue],['Ημερομηνία',fmtDate(m.date)],['Κατάσταση',m.status==='live'?'Σε εξέλιξη':'Τελικό']];
  return yourLog
    + '<div class="sec-title">Στοιχεία αγώνα</div>'
    + '<div class="info-card">'+info.map(r=>'<div class="info-row"><span class="k">'+r[0]+'</span><span class="v">'+esc(r[1])+'</span></div>').join('')+'</div>'
    + '<div class="sec-title">Παίκτες-κλειδιά</div>'
    + '<div class="info-card">'+m.players.map(p=>'<div class="players-row"><span class="pdot"></span><span>'+esc(p)+'</span></div>').join('')+'</div>'
    + '<button class="cta" data-action="setTab" data-tab="rate">'+(log?'Επεξεργασία καταγραφής':'Βαθμολόγησε τον αγώνα')+'</button>';
}
function tabRate(d,m){
  const stars = [1,2,3,4,5].map(i=>'<span class="'+(i<=d.rating?'on':'')+'" data-action="setRating" data-val="'+i+'">★</span>').join('');
  const pills = m.players.map((p,i)=>'<button class="pill '+(d.potm===p?'on':'')+'" data-action="setPotm" data-idx="'+i+'">'+esc(p)+'</button>').join('');
  return '<div class="label">Βαθμολογία</div><div class="stars">'+stars+'</div>'
    + '<div class="rate-label">'+(d.rating?esc(RATING_LABELS[d.rating]):'Πάτα τα αστέρια')+'</div>'
    + '<div class="label">Η κριτική σου</div>'
    + '<textarea data-field="review" placeholder="Πώς ήταν ο αγώνας; Φάσεις, ατμόσφαιρα, συναίσθημα…">'+esc(d.review)+'</textarea>'
    + '<div class="label">Player of the Match</div><div class="pills">'+pills+'</div>'
    + logButton(d);
}
function tabExperience(d,m){
  const opts = Object.keys(LOCATIONS).map(k=>{
    const o = LOCATIONS[k];
    return '<div class="loc-opt '+(d.location===k?'on':'')+'" data-action="setLocation" data-loc="'+k+'">'
      + '<div class="lic">'+icon(o.icon,20)+'</div>'
      + '<div><div class="nm">'+o.label+'</div><div class="tiny muted">'+o.sub+'</div></div>'
      + '<div class="ck">'+icon('check',18)+'</div></div>';
  }).join('');
  let extra = '';
  if(d.location==='stadium'){
    const atmo = ATMOSPHERES.map(a=>'<button class="pill '+(d.atmosphere.indexOf(a[0])>=0?'on':'')+'" data-action="toggleAtmo" data-atmo="'+a[0]+'">'+esc(a[1])+'</button>').join('');
    extra = '<div class="venue-note">'+icon('pin',16)+'<span>Ήσουν στο '+esc(m.venue)+'</span></div>'
      + '<div class="label">Ατμόσφαιρα</div><div class="pills">'+atmo+'</div>'
      + '<div class="label">Φωτογραφίες</div><div class="photo-grid"><div class="ptile">'+icon('plus',20)+'</div><div class="ptile">'+icon('plus',20)+'</div><div class="ptile">'+icon('plus',20)+'</div></div>'
      + '<div class="tiny muted center mt8">Placeholder — οι φωτογραφίες δεν αποθηκεύονται.</div>';
  }
  return '<div class="label">Πού το παρακολούθησες;</div><div class="loc-opts">'+opts+'</div>'+extra
    + '<div class="label">Σημείωση / ανάμνηση</div>'
    + '<textarea data-field="memory" placeholder="Μια ανάμνηση από εκείνη τη μέρα…">'+esc(d.memory)+'</textarea>'
    + logButton(d);
}
function logButton(d){
  const edit = !!state.logs[d.matchId];
  return '<button class="cta '+(edit?'edit':'')+'" data-action="logMatch">'+(edit?'Ενημέρωση καταγραφής':'Καταγραφή αγώνα')+'</button>';
}

/* ---------- STATS ---------- */
function statBar(label, val, pct, color){
  return '<div class="bar-line"><div class="bl">'+label+'</div>'
    + '<div class="sbar"><div class="sfill" data-fill="'+pct+'%" style="width:0;background:'+color+'"></div></div>'
    + '<div class="bv">'+val+'</div></div>';
}
function renderStats(){
  if(!state.settings.showStats){
    return '<h1>Στατιστικά</h1><div class="bar-card center" style="padding:30px"><div class="muted">Τα στατιστικά είναι κρυφά.</div>'
      + '<button class="cta" style="margin-top:16px;max-width:200px" data-action="toggleStats">Εμφάνιση</button></div>';
  }
  const logs = logsArr();
  if(logs.length===0){
    return '<h1>Στατιστικά</h1>'+emptyState('stats','Δεν υπάρχουν στατιστικά ακόμη','Κατέγραψε μερικούς αγώνες και θα δεις εδώ τα insights σου.');
  }
  const reviews = logs.filter(l=>l.review&&l.review.trim()).length;
  const stadiums = logs.filter(l=>l.location==='stadium').length;
  const rated = logs.filter(l=>l.rating);
  const avg = rated.length ? (rated.reduce((a,l)=>a+l.rating,0)/rated.length) : 0;
  const fb = logs.filter(l=>{const m=matchById(l.matchId);return m&&m.sport==='football';}).length;
  const bb = logs.length - fb;
  const loc = { stadium:0, home:0, bar:0 };
  logs.forEach(l=>{ if(l.location && loc[l.location]!=null) loc[l.location]++; });
  const dist = [0,0,0,0,0];
  logs.forEach(l=>{ if(l.rating) dist[l.rating-1]++; });
  const distMax = Math.max(...dist, 1);
  const top = rated.slice().sort((a,b)=>b.rating-a.rating)[0];
  const topM = top ? matchById(top.matchId) : null;
  const pct = (n,d)=> d?Math.round(n/d*100):0;

  let html = '<h1>Στατιστικά</h1><p class="sub">Η χρονιά σου στο Bleachers.</p>'
    + '<div class="stat-hero"><div class="big nums">'+logs.length+'</div>'
    + '<div class="muted" style="margin-top:4px">αγώνες καταγεγραμμένοι το 2026</div></div>'
    + '<div class="mini-grid">'
    + '<div class="mini"><div class="v" style="color:var(--gold)">'+avg.toFixed(1)+'</div><div class="k">Μ.Ο. βαθμ.</div></div>'
    + '<div class="mini"><div class="v">'+reviews+'</div><div class="k">Κριτικές</div></div>'
    + '<div class="mini"><div class="v">'+stadiums+'</div><div class="k">Στο γήπεδο</div></div>'
    + '</div>'
    + '<div class="bar-card"><b>Ανά άθλημα</b>'
    + statBar('⚽ Ποδόσφαιρο', pct(fb,logs.length)+'%', pct(fb,logs.length), 'var(--accent)')
    + statBar('🏀 Μπάσκετ', pct(bb,logs.length)+'%', pct(bb,logs.length), 'var(--gold)')
    + '</div>'
    + '<div class="bar-card"><b>Πού τους είδες</b>'
    + statBar('Γήπεδο', loc.stadium, pct(loc.stadium,logs.length), 'var(--accent)')
    + statBar('Σπίτι', loc.home, pct(loc.home,logs.length), '#5B9BE0')
    + statBar('Μπαρ', loc.bar, pct(loc.bar,logs.length), 'var(--gold)')
    + '</div>'
    + '<div class="bar-card"><b>Κατανομή βαθμολογίας</b>'
    + [5,4,3,2,1].map(r=>statBar('<span style="color:var(--gold)">'+r+'★</span>', dist[r-1], Math.round(dist[r-1]/distMax*100), 'var(--gold)')).join('')
    + '</div>';
  if(topM){
    html += '<div class="sec-title">Κορυφαία βαθμολογία</div>'
      + '<div class="mgroup"><div class="ghead"><span class="gbadge" style="background:var(--gold);color:#2a1900">'+icon('trophy',13)+'</span><span class="gname">Top αγώνας</span></div>'
      + matchRow(topM) + '</div>';
  }
  return html;
}

/* ---------- PROFILE ---------- */
function renderProfile(){
  const logs = logsArr();
  const reviews = logs.filter(l=>l.review&&l.review.trim()).length;
  const stadiums = logs.filter(l=>l.location==='stadium').length;
  const leagues = new Set(logs.map(l=>{const m=matchById(l.matchId);return m&&m.league;}).filter(Boolean)).size;
  const recent = logs.slice().sort((a,b)=>(b.updatedAt||'').localeCompare(a.updatedAt||'')).slice(0,5).map(l=>{
    const m = matchById(l.matchId); if(!m) return '';
    return '<div class="mini-log" data-action="openMatch" data-id="'+m.id+'">'+crest(m.home,26)
      + '<div><div style="font-weight:700;font-size:14px">'+esc(m.home.abbr)+' '+m.score.home+'–'+m.score.away+' '+esc(m.away.abbr)+'</div>'
      + '<div class="tiny muted">'+esc(m.league)+(l.location?' · '+esc(LOCATIONS[l.location].label):'')+'</div></div>'
      + '<span class="ml-rt">'+starsGlyph(l.rating)+'</span></div>';
  }).join('');

  return '<h1>Προφίλ</h1>'
    + '<div class="prof-card"><div class="prof-head"><div class="avatar">'+esc(state.user.name[0])+'</div>'
    + '<div><div class="prof-name">'+esc(state.user.name)+'</div>'
    + '<div class="tiny muted">'+esc(state.user.handle)+' · '+esc(state.user.city)+'</div></div></div>'
    + '<div class="counters">'
    + '<div class="counter"><div class="v">'+logs.length+'</div><div class="k">Αγώνες</div></div>'
    + '<div class="counter"><div class="v">'+reviews+'</div><div class="k">Κριτικές</div></div>'
    + '<div class="counter"><div class="v">'+stadiums+'</div><div class="k">Γήπεδα</div></div>'
    + '<div class="counter"><div class="v">'+leagues+'</div><div class="k">Λίγκες</div></div>'
    + '</div></div>'
    + '<div class="sec-title">Αγαπημένες ομάδες</div>'
    + '<div>'+state.user.favoriteTeams.map(t=>'<span class="team-pill">'+crest(t,24)+esc(t.name)+' <span class="sp">'+(t.sport==='football'?'⚽':'🏀')+'</span></span>').join('')+'</div>'
    + '<div class="sec-title">Πρόσφατες καταγραφές</div>'
    + '<div class="set-card">'+(recent||'<div class="empty" style="padding:24px">Δεν έχεις καταγράψει αγώνες ακόμη.</div>')+'</div>'
    + '<div class="sec-title">Ρυθμίσεις</div>'
    + '<div class="set-card">'
    + '<div class="set-row"><div><div style="font-weight:700">Εμφάνιση στατιστικών</div><div class="tiny muted">Έλεγξε την καρτέλα Στατιστικά</div></div>'
    + '<div class="tgl '+(state.settings.showStats?'on':'')+'" data-action="toggleStats"></div></div>'
    + '<div class="set-row"><div><div style="font-weight:700">Διαγραφή δεδομένων</div><div class="tiny muted">Σβήνει όλες τις καταγραφές</div></div>'
    + '<div class="danger" data-action="confirmReset">Reset</div></div>'
    + '</div>';
}

/* ---------- SHEET / MODALS ---------- */
function renderSheet(){
  const s = App.ui.sheet, m = matchById(s.matchId);
  return '<div class="sheet-wrap" data-action="closeSheet"><div class="sheet" data-stop="1">'
    + '<div class="sheet-grab"></div>'
    + '<div class="sheet-check">'+icon('check',28)+'</div>'
    + '<h3>'+(s.edit?'Ενημερώθηκε!':'Καταγράφηκε!')+'</h3>'
    + '<div class="center tiny muted">Προστέθηκε στο προφίλ σου</div>'
    + '<div class="s-match">'+crest(m.home,28)+'<span>'+esc(m.home.abbr)+' '+m.score.home+'–'+m.score.away+' '+esc(m.away.abbr)+'</span>'+crest(m.away,28)+'</div>'
    + '<div class="s-stars">'+starsGlyph(s.rating)+'</div>'
    + '<div class="modal-actions" style="margin-top:18px">'
    + '<button class="btn ghost" data-action="sheetStats">Στατιστικά</button>'
    + '<button class="btn primary" data-action="closeSheet">Τέλεια</button>'
    + '</div></div></div>';
}
function ratingModal(){
  return '<div class="overlay" data-action="closeModal"><div class="modal" data-stop="1"><div class="modal-ic">'+icon('star',40)+'</div>'
    + '<h3 class="center">Χρειάζεται βαθμολογία</h3><p class="center">Βάλε τουλάχιστον 1 αστέρι πριν την καταγραφή.</p>'
    + '<div class="modal-actions"><button class="btn primary" data-action="closeModal">Εντάξει</button></div></div></div>';
}
function resetModal(){
  return '<div class="overlay" data-action="closeModal"><div class="modal" data-stop="1"><div class="modal-ic" style="color:var(--live)">'+icon('trophy',38)+'</div>'
    + '<h3 class="center">Διαγραφή όλων;</h3><p class="center">Όλες οι καταγραφές σου θα σβηστούν οριστικά.</p>'
    + '<div class="modal-actions"><button class="btn ghost" data-action="closeModal">Άκυρο</button>'
    + '<button class="btn red" data-action="doReset">Διαγραφή</button></div></div></div>';
}

/* ---------- EMPTY STATE / NAV / ROOT ---------- */
function emptyState(ic,title,sub){
  return '<div class="empty"><div class="ec">'+icon(ic,26)+'</div><div style="font-weight:700;color:var(--text)">'+esc(title)+'</div><div class="mt8">'+esc(sub)+'</div></div>';
}
function bottomNav(active){
  const item = (s,ic,label)=>'<button class="nitem '+(active===s?'active':'')+'" data-action="nav" data-screen="'+s+'">'+icon(ic,22)+'<span>'+label+'</span></button>';
  return '<nav class="bnav">'+item('feed','scores','Αγώνες')+item('live','live','Live')
    + '<button class="fab" data-action="openPicker">'+icon('plus',26)+'</button>'
    + item('stats','stats','Στατιστικά')+item('profile','profile','Προφίλ')+'</nav>';
}
function screenBody(s){
  if(s==='feed') return renderFeed();
  if(s==='live') return renderLive();
  if(s==='stats') return renderStats();
  if(s==='profile') return renderProfile();
  if(s==='picker') return renderPicker();
  return renderFeed();
}
function render(){
  const ui = App.ui;
  let html = '<div class="shell">';
  if(ui.screen==='matchDetail'){
    html += renderMatchDetail();
  } else {
    html += topBar() + '<div class="screen">' + screenBody(ui.screen) + '</div>';
  }
  html += bottomNav(ui.screen) + '</div>';
  if(ui.sheet) html += renderSheet();
  if(ui.modal) html += ui.modal;
  document.getElementById('app').innerHTML = html;
  requestAnimationFrame(()=>{ document.querySelectorAll('[data-fill]').forEach(el=>{ el.style.width = el.dataset.fill; }); });
}

/* =============================================================================
   (4) ACTIONS
============================================================================= */
function setSport(s){ state.activeSport=s; save(); render(); }
function setFilter(f){ state.feedFilter=f; render(); }
function nav(s){ App.ui.screen=s; window.scrollTo(0,0); render(); }
function toggleStar(id){ if(state.followed[id]) delete state.followed[id]; else state.followed[id]=true; save(); render(); }

function openMatch(id){
  if(App.ui.screen!=='matchDetail') App.ui.backScreen = App.ui.screen;
  const log = state.logs[id];
  App.ui.draft = log
    ? { matchId:id, rating:log.rating, review:log.review||'', potm:log.potm||null, location:log.location||null, atmosphere:[...(log.atmosphere||[])], memory:log.memory||'', tab:'summary' }
    : { matchId:id, rating:0, review:'', potm:null, location:null, atmosphere:[], memory:'', tab:'summary' };
  App.ui.screen='matchDetail'; window.scrollTo(0,0); render();
}
function applyLog(d){
  const existing = state.logs[d.matchId];
  state.logs[d.matchId] = {
    matchId:d.matchId, rating:d.rating, review:d.review||'', potm:d.potm||null,
    location:d.location||null, atmosphere:d.atmosphere||[], memory:d.memory||'',
    loggedAt: existing?existing.loggedAt:new Date().toISOString(), updatedAt:new Date().toISOString(),
  };
  save();
  return !existing;
}
function logMatch(){
  const d = App.ui.draft;
  if(!d.rating){ App.ui.modal = ratingModal(); render(); return; }
  const isNew = applyLog(d);
  App.ui.sheet = { matchId:d.matchId, rating:d.rating, edit:!isNew };
  render();
}
function closeSheet(){ const m=matchById(App.ui.sheet.matchId); App.ui.sheet=null; App.ui.draft=null; if(m) state.activeSport=m.sport; save(); nav('feed'); }
function sheetStats(){ App.ui.sheet=null; App.ui.draft=null; nav('stats'); }
function toggleStats(){ state.settings.showStats=!state.settings.showStats; save(); render(); }
function confirmReset(){ App.ui.modal = resetModal(); render(); }
function doReset(){ state = defaultState(); save(); App.ui = { screen:'profile', backScreen:'feed', draft:null, sheet:null, modal:null }; render(); }
function closeModal(){ App.ui.modal=null; render(); }

const ACTIONS = {
  nav: el=>nav(el.dataset.screen),
  setSport: el=>setSport(el.dataset.sport),
  setFilter: el=>setFilter(el.dataset.filter),
  toggleStar: el=>toggleStar(el.dataset.id),
  openPicker: ()=>nav('picker'),
  openMatch: el=>openMatch(el.dataset.id),
  back: ()=>nav(App.ui.backScreen||'feed'),
  setTab: el=>{ App.ui.draft.tab=el.dataset.tab; render(); },
  setRating: el=>{ App.ui.draft.rating=+el.dataset.val; render(); },
  setPotm: el=>{ const m=matchById(App.ui.draft.matchId); App.ui.draft.potm=m.players[+el.dataset.idx]; render(); },
  setLocation: el=>{ App.ui.draft.location=el.dataset.loc; render(); },
  toggleAtmo: el=>{ const a=App.ui.draft.atmosphere, k=el.dataset.atmo, i=a.indexOf(k); if(i>=0)a.splice(i,1); else a.push(k); render(); },
  logMatch: ()=>logMatch(),
  closeSheet: ()=>closeSheet(),
  sheetStats: ()=>sheetStats(),
  toggleStats: ()=>toggleStats(),
  confirmReset: ()=>confirmReset(),
  doReset: ()=>doReset(),
  closeModal: ()=>closeModal(),
};

/* =============================================================================
   (5) NAVIGATION & INIT
============================================================================= */
document.addEventListener('click', e=>{
  // overlay/sheet backdrop closes; inner content (data-stop) does not bubble to it
  const stop = e.target.closest('[data-stop]');
  const t = e.target.closest('[data-action]');
  if(!t) return;
  // if the clicked action is the backdrop itself but we're inside protected content, ignore
  if((t.getAttribute('data-action')==='closeSheet' || t.getAttribute('data-action')==='closeModal') && stop && t.contains(stop) && stop!==t) return;
  const fn = ACTIONS[t.getAttribute('data-action')];
  if(fn){ e.preventDefault(); fn(t); }
});
document.addEventListener('input', e=>{
  const f = e.target.getAttribute && e.target.getAttribute('data-field');
  if(!f || !App.ui.draft) return;
  App.ui.draft[f] = e.target.value;   // keep draft synced without re-render (caret-safe)
});

render();
</script>
</body>
</html>
